version: 2
updates:
  # npm 항목의 cooldown은 pnpm minimumReleaseAge(7200분=5일)와 맞춘다. 게시 5일 미만 버전으로
  # 올리면 lockfile 재생성과 frozen install의 공급망 정책 검사가 그 버전을 거부한다.
  # (cooldown은 버전 업데이트에만 적용되고 보안 업데이트에는 적용되지 않는다.)

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 루트 package.json
  # pnpm 버전(packageManager)은 .github/sdk-versions.json 이 기준이다. 올릴 때는 기준 파일을 고친 뒤
  # `node .github/scripts/sdk-update/sync-sdk-versions.cjs apply` 로 모든 파일에 반영하므로 여기서는 제외한다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "pnpm"

  # SDK 생성기
  - package-ecosystem: "npm"
    directory: "/sdk-runtime-generator~"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "@apps-in-toss/web-framework"
      - dependency-name: "pnpm"

  # WebGL 빌드 설정
  # @apps-in-toss/* 버전은 SDK 업데이트 워크플로(update.yml)가 web-framework에 맞춰 함께 올린다.
  - package-ecosystem: "npm"
    directory: "/WebGLTemplates/AITTemplate/BuildConfig~"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "@apps-in-toss/web-framework"
      - dependency-name: "@apps-in-toss/devtools"
      - dependency-name: "pnpm"

  # E2E 테스트
  - package-ecosystem: "npm"
    directory: "/Tests~/E2E/tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  # 공유 테스트 스크립트
  - package-ecosystem: "npm"
    directory: "/Tests~/E2E/SharedScripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
