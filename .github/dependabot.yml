version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 루트 package.json
  # pnpm 버전(packageManager)은 .github/sdk-versions.json 이 기준이다. 올릴 때는 기준 파일을 고친 뒤
  # `node .github/scripts/sdk-update/sync-sdk-versions.cjs apply` 로 모든 파일에 반영하므로 여기서는 제외한다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pnpm"

  # SDK 생성기
  - package-ecosystem: "npm"
    directory: "/sdk-runtime-generator~"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@apps-in-toss/web-framework"
      - dependency-name: "@apps-in-toss/framework"
      - dependency-name: "@apps-in-toss/web-analytics"
      - dependency-name: "pnpm"

  # WebGL 빌드 설정
  # @apps-in-toss/* 버전은 SDK 업데이트 워크플로(update.yml)가 web-framework에 맞춰 함께 올린다.
  - package-ecosystem: "npm"
    directory: "/WebGLTemplates/AITTemplate/BuildConfig~"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@apps-in-toss/web-framework"
      - dependency-name: "@apps-in-toss/web-analytics"
      - dependency-name: "@apps-in-toss/bridge-core"
      - dependency-name: "@apps-in-toss/devtools"
      - dependency-name: "pnpm"

  # E2E 테스트
  - package-ecosystem: "npm"
    directory: "/Tests~/E2E/tests"
    schedule:
      interval: "weekly"

  # 공유 테스트 스크립트
  - package-ecosystem: "npm"
    directory: "/Tests~/E2E/SharedScripts"
    schedule:
      interval: "weekly"
