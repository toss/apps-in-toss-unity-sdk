name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  check-unity-meta-files:
    name: Check Unity .meta files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check for missing .meta files
        run: |
          echo "Unity .meta 파일 누락 검사 중..."
          echo ""

          MISSING=()

          # -------------------------------------------------------
          # 1) 루트 레벨: 숨김/~접미사/node_modules 제외한 모든 파일과 폴더에 .meta 확인
          # -------------------------------------------------------
          for item in *; do
            # 숨김 파일/폴더 제외 (. 으로 시작)
            case "$item" in
              .*) continue ;;
            esac
            # ~ 접미사 제외 (Unity가 무시)
            case "$item" in
              *~) continue ;;
            esac
            # node_modules 제외
            [ "$item" = "node_modules" ] && continue
            # .meta 파일 자체 제외
            case "$item" in
              *.meta) continue ;;
            esac

            if [ ! -f "${item}.meta" ]; then
              MISSING+=("$item")
            fi
          done

          # -------------------------------------------------------
          # 2) 하위 디렉토리: 재귀적으로 모든 파일과 폴더에 .meta 확인
          # -------------------------------------------------------
          # 검사 대상 디렉토리 수집 (루트에서 숨김/~접미사/node_modules 제외)
          ROOT_DIRS=()
          for item in */; do
            item="${item%/}"
            case "$item" in
              .*) continue ;;
              *~) continue ;;
              node_modules) continue ;;
            esac
            ROOT_DIRS+=("$item")
          done

          for dir in "${ROOT_DIRS[@]}"; do
            # find로 하위 파일 및 폴더 검사
            # - ~접미사 디렉토리는 prune
            # - node_modules는 prune
            # - 숨김 파일/폴더 제외
            # - .meta 파일 자체 제외
            while IFS= read -r -d '' entry; do
              if [ ! -e "${entry}.meta" ]; then
                MISSING+=("$entry")
              fi
            done < <(find "$dir" \
              -mindepth 1 \
              \( -type d -name "node_modules" -prune \) -o \
              \( -type d -name "*~" -prune \) -o \
              \( -name ".*" -prune \) -o \
              -not -name "*.meta" \
              -print0)
          done

          # -------------------------------------------------------
          # 결과 출력
          # -------------------------------------------------------
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Unity .meta 파일이 누락되었습니다!"
            echo ""
            echo "다음 항목에 대한 .meta 파일이 없습니다:"
            for item in "${MISSING[@]}"; do
              echo "  - $item"
            done
            echo ""
            echo "해결 방법:"
            echo "  1. Unity Editor에서 프로젝트를 열어 자동으로 .meta 파일 생성"
            echo "  2. 또는 기존 .meta 파일을 참고하여 수동으로 생성 (GUID 포함)"
            exit 1
          fi

          echo "✓ 모든 Unity 파일에 .meta 파일이 있습니다."

      - name: Check .meta GUID hygiene
        # 배포 .meta의 중복 GUID / 손-작성 순차 GUID 검사 (techchat #4076 재발 방지).
        # Node stdlib만 사용 — ubuntu-latest 기본 Node로 충분.
        run: node "scripts~/check-meta-guids.js"

  check-fixture-buildconfig-sync:
    name: Check E2E fixture package.json 불변식
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check E2E fixture package.json invariants
        # E2E 픽스처(Tests~/E2E/*/Assets/.../BuildConfig~/package.json)는 빌드 시
        # Editor/Package/BuildConfigMerger.cs가 SDK 정본(WebGLTemplates/AITTemplate/BuildConfig~/package.json)과
        # 병합해 ait-build/package.json을 만든다. 이 병합기는:
        #   1) 병합 결과를 SDK JSON 전체로 시드하고(top-level 키는 SDK가 전부 소유 — name/version/type/scripts 등
        #      프로젝트 값은 애초에 복사되지 않음), dependencies/devDependencies만 프로젝트 값과 키 단위로 병합한다.
        #   2) 그 병합에서도 SDK 키가 항상 프로젝트 값을 덮어쓴다(무조건 SDK 승리).
        #   3) 프로젝트의 top-level "pnpm"/"scripts" 키는 병합 결과에 전혀 반영되지 않는다.
        # 따라서 픽스처에 SDK 소유 키(정본 dependencies/devDependencies)나 pnpm/scripts 같은 미반영 top-level
        # 키를 선언해봐야 실제 빌드 산출물에는 영향이 없고, 오해만 유발하는 죽은 선언이 된다.
        # 이 가드는 "값 일치"가 아니라 "SDK 소유 키를 픽스처가 선언하지 않는다"는 불변식을 검사한다 —
        # SDK Update 자동화(update.yml)가 정본만 bump해도 이 가드는 걸리지 않는다.
        run: |
          set -euo pipefail

          CANONICAL="WebGLTemplates/AITTemplate/BuildConfig~/package.json"
          echo "E2E 픽스처 package.json이 불변식을 지키는지 검사 중..."
          echo "정본: $CANONICAL"
          echo ""

          ALLOWED_TOP_LEVEL_KEYS='["name","version","type","private","dependencies","devDependencies"]'
          FAILED=0
          shopt -s nullglob

          for FIXTURE in Tests~/E2E/*/Assets/WebGLTemplates/AITTemplate/BuildConfig~/package.json; do
            [ -f "$FIXTURE" ] || continue

            # 1) top-level 키 allowlist 검사
            EXTRA_KEYS=$(jq -r --argjson allowed "$ALLOWED_TOP_LEVEL_KEYS" \
              '(keys) - $allowed | .[]' "$FIXTURE")
            while IFS= read -r EXTRA_KEY; do
              [ -z "$EXTRA_KEY" ] && continue
              echo "::error::[$FIXTURE] 허용되지 않는 top-level 키 \"$EXTRA_KEY\" — BuildConfigMerger는 dependencies/devDependencies 외 프로젝트 top-level 키(특히 scripts/pnpm)를 병합 산출물(ait-build/package.json)에 절대 반영하지 않습니다. 픽스처에 남겨두면 실제로는 죽어 있는 선언이 실행 가능한 것처럼 오해를 유발하니 제거하세요."
              FAILED=1
            done <<< "$EXTRA_KEYS"

            # 2) SDK 소유 키 금지 (dependencies/devDependencies)
            for SECTION in dependencies devDependencies; do
              SDK_KEYS=$(jq -r --arg s "$SECTION" '.[$s] // {} | keys[]' "$CANONICAL")
              while IFS= read -r KEY; do
                [ -z "$KEY" ] && continue
                if jq -e --arg s "$SECTION" --arg k "$KEY" 'has($s) and (.[$s] | has($k))' "$FIXTURE" > /dev/null; then
                  echo "::error::[$FIXTURE] $SECTION.\"$KEY\"는 SDK 소유 키입니다 — 빌드 시 BuildConfigMerger가 SDK 값을 항상 주입하므로(무조건 SDK 승리) 픽스처에 선언해도 실제 병합 산출물에는 영향이 없고 드리프트로 독자를 오도하기만 합니다. 픽스처에는 프로젝트 소유 의존성만 선언하세요. 의도적으로 SDK 키를 픽스처에 둬야 하는 예외가 생기면 이 가드(.github/workflows/lint.yml의 check-fixture-buildconfig-sync)를 함께 수정하세요."
                  FAILED=1
                fi
              done <<< "$SDK_KEYS"
            done
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "E2E 픽스처 package.json이 불변식을 위반했습니다. 위 오류를 참고해 픽스처에서"
            echo "SDK 소유 키와 미반영 top-level 키(scripts/pnpm 등)를 제거하세요."
            exit 1
          fi

          echo "✓ 모든 E2E 픽스처 package.json이 불변식을 지킵니다."

  ci-scripts:
    name: CI 스크립트 위생 검사
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: actionlint 설치 (버전 고정, 체크섬 검증)
        # rhysd/actionlint 릴리즈 바이너리를 고정 버전으로 받아 공식 체크섬(*_checksums.txt)으로
        # 무결성을 검증한다. actionlint가 공식 권장하는 download-actionlint.bash는 체크섬을
        # 검증하지 않으므로 쓰지 않는다.
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          curl -fsSLO "${BASE_URL}/${ARCHIVE}"
          curl -fsSLO "${BASE_URL}/${CHECKSUMS}"
          grep " ${ARCHIVE}\$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: actionlint 실행 (-shellcheck=)
        # shellcheck 통합은 끄고 별도 스텝에서 shellcheck를 직접 돈다.
        # release.yml의 SENTRY_AUTH_TOKEN workflow_call secrets 오탐(bulk-release가
        # secrets: inherit으로 호출해 런타임에는 전달됨)은 명시적으로 ignore한다.
        # release.yml 자체는 이 PR에서 고치지 않는다.
        run: |
          set -euo pipefail
          actionlint -shellcheck= -ignore 'property "sentry_auth_token" is not defined'

      - name: .github/scripts 셸 스크립트 검사 (bash -n, shellcheck)
        # shellcheck는 ubuntu-latest에 기본 탑재되어 있어 별도로 설치하지 않는다.
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          FILES=(.github/scripts/**/*.sh)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "검사 대상 없음: .github/scripts/**/*.sh"
            exit 0
          fi
          for f in "${FILES[@]}"; do
            echo "::group::$f"
            bash -n "$f"
            shellcheck -S error "$f"
            echo "::endgroup::"
          done

      - name: .github/scripts PowerShell 스크립트 ASCII 검사
        # PowerShell 5.1이 BOM 없는 UTF-8을 CP949로 오독하는 문제(unity-build.yml 참고)를
        # 피하기 위해 .ps1은 ASCII 전용으로 강제한다. 설명은 YAML 스텝 이름/주석에 한국어로 둔다.
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          FILES=(.github/scripts/**/*.ps1)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "검사 대상 없음: .github/scripts/**/*.ps1"
            exit 0
          fi
          FAILED=0
          for f in "${FILES[@]}"; do
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "::error file=${f}::ASCII 외 문자가 포함되어 있습니다. PowerShell 5.1이 BOM 없는 UTF-8을 CP949로 오독할 수 있습니다."
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: .github/scripts Node 스크립트 문법 검사 (node --check)
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          FILES=(.github/scripts/**/*.js .github/scripts/**/*.cjs)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "검사 대상 없음: .github/scripts/**/*.{js,cjs}"
            exit 0
          fi
          for f in "${FILES[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
