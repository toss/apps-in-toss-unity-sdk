name: Release
run-name: "Release${{ inputs.version && format(' - v{0}', inputs.version) || '' }}"

# 릴리스 버전은 .github/sdk-versions.json 의 sdkVersion 이다 (`<wf>+<N>`).
#   고정 태그  release/v<wf>+<N>  한 번 만들면 옮기거나 지우지 않는다. GitHub Release 는 이 태그에만 붙는다.
#   별칭 태그  release/v<wf>      Release 를 게시한 뒤 새 리비전 커밋으로 옮긴다. Release 는 붙이지 않는다.
# 새 리비전은 sdkVersion 의 +N 을 올려 main 에 머지하면 만들어진다.
# 공개되는 단계(태그·Release·별칭)는 GitHub environment `release` 의 승인을 받은 뒤에만 실행한다.

on:
  # 현재 기준 파일의 sdkVersion 게시를 다시 시도할 때만 쓴다. version 은 비워 두거나 기준 파일 값과 같아야 한다.
  workflow_dispatch:
    inputs:
      version:
        description: '선택. 비우면 기준 파일의 sdkVersion을 쓴다. 입력하면 기준 파일 값(예: 3.10.0+1)과 같아야 한다'
        required: false
        type: string
      build_strategy:
        description: '빌드 전략: full (10빌드), standard (5빌드), minimal (1빌드), skip-build (0빌드)'
        required: false
        type: choice
        options:
          - full
          - standard
          - minimal
          - skip-build
        default: minimal

  # sdkVersion(기준 파일)이 바뀌어 main 에 머지되면 자동 릴리즈
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/sdk-versions.json'

permissions:
  contents: read

# 릴리스는 한 번에 하나만. 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # =====================================================
  # 버전 결정
  # =====================================================
  release:
    name: 버전 결정
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      revision: ${{ steps.version.outputs.revision }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      alias_name: ${{ steps.version.outputs.alias_name }}
      skip: ${{ steps.version.outputs.skip }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 버전 결정
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 릴리스 버전은 기준 파일(.github/sdk-versions.json)의 sdkVersion 이다.
          # 수동 실행의 version 입력은 같은 값을 확인하는 용도일 뿐 다른 버전을 고르지 못한다.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::main 브랜치에서만 릴리스할 수 있습니다 (현재: ${REF})"
            exit 1
          fi

          SOURCE_SHA=$(git rev-parse HEAD)
          VERSION=$(jq -r '.sdkVersion' .github/sdk-versions.json)
          echo "기준 파일 sdkVersion: ${VERSION} (커밋 ${SOURCE_SHA})"

          # 아래에서 skip=false 로 덮어쓰기 전까지는 건너뛴다 (GITHUB_OUTPUT 은 마지막 값이 이긴다)
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "version=${VERSION}"
            echo "skip=true"
          } >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "::error::입력한 버전(${INPUT_VERSION})이 기준 파일의 sdkVersion(${VERSION})과 다릅니다. 수동 실행은 현재 기준 파일의 버전 게시를 다시 시도할 때만 씁니다."
            exit 1
          fi

          # 형식 검증: <wf>+<N> (N >= 1, 앞자리 0 없음), <wf> 는 X.Y.Z 또는 X.Y.Z-prerelease
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z][a-zA-Z0-9.]*)?(\+[1-9][0-9]*)?$ ]]; then
            echo "::error::올바른 버전 형식이 아닙니다: ${VERSION}"
            exit 1
          fi

          CORE="${VERSION%%+*}"
          echo "core=${CORE}" >> "$GITHUB_OUTPUT"

          # 리비전 없는 값은 과거 릴리스를 가리키는 값으로만 남겨 둔다. 새로 릴리스하지 않는다.
          if [[ "$VERSION" != *"+"* ]]; then
            echo "::notice::sdkVersion(${VERSION})에 리비전(+N)이 없어 릴리스하지 않습니다. 새 릴리스는 <버전>+<N> 형식만 만듭니다."
            exit 0
          fi

          REVISION="${VERSION##*+}"
          TAG_NAME="release/v${VERSION}"
          ALIAS_NAME="release/v${CORE}"
          {
            echo "revision=${REVISION}"
            echo "tag_name=${TAG_NAME}"
            echo "alias_name=${ALIAS_NAME}"
          } >> "$GITHUB_OUTPUT"

          # 고정 태그가 이미 있으면 이미 릴리스한 리비전이다 (고정 태그는 옮기지 않는다)
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "::notice::이미 릴리스한 리비전입니다 (${TAG_NAME}). 새 릴리스가 필요하면 sdkVersion 의 +N 을 올리세요."
            exit 0
          fi

          # 배포 제외 버전(denylist) 검사 — 건너뛴 버전의 실수 재배포 방지 (core 기준)
          DENIED_VERSIONS=$(jq -r '(.deniedVersions // [])[]' sdk-policy.json)
          for DENIED in $DENIED_VERSIONS; do
            if [ "$CORE" = "$DENIED" ] || [[ "$CORE" == "$DENIED"-* ]]; then
              echo "::error::배포가 제외된 버전입니다: ${VERSION} (거부 목록: ${DENIED})"
              exit 1
            fi
          done

          # 별칭(release/v<core>)에 옛 GitHub Release 가 붙어 있으면 옮길 수 없다. 빌드를 돌리기 전에 알린다.
          bash .github/scripts/release/release-refs.sh check-alias "$ALIAS_NAME"

          echo "버전 검증 통과: ${VERSION} (core ${CORE}, 리비전 +${REVISION})"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  # =====================================================
  # SDK Runtime 재생성 (Orphan Commit)
  # main branch를 건드리지 않고 orphan commit 생성
  # =====================================================
  regenerate-sdk:
    name: SDK Runtime 재생성
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.skip != 'true'
    # _build/ 임시 브랜치를 push 한다
    permissions:
      contents: write

    outputs:
      ref: ${{ steps.commit.outputs.ref }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 버전을 결정한 커밋 그대로 쓴다 (그 사이 main 이 움직여도 다른 버전이 섞이지 않는다)
          ref: ${{ needs.release.outputs.source_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # 동반 패키지(devtools) 버전은 기준 파일(.github/sdk-versions.json)에 이미 정해져 있다.
      # 리뷰를 거쳐 머지된 값을 그대로 쓰고, 이 실행이 릴리스하려는 버전과 같은지만 확인한다.
      - name: 기준 파일 확인
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CORE: ${{ needs.release.outputs.core }}
        run: |
          CURRENT=$(jq -r '.sdkVersion' .github/sdk-versions.json)
          WF=$(jq -r '.webFramework' .github/sdk-versions.json)
          if [ "$VERSION" != "$CURRENT" ] || [ "$CORE" != "$WF" ]; then
            echo "::error::기준 파일(sdkVersion ${CURRENT}, webFramework ${WF})이 릴리스 대상(${VERSION}, core ${CORE})과 다릅니다."
            exit 1
          fi
          cat .github/sdk-versions.json

      - name: web-framework 버전 업데이트 및 SDK 재생성
        working-directory: sdk-runtime-generator~
        run: |
          # web-framework 버전은 core 다 (리비전 +N 은 npm 에 없다)
          VERSION="${{ needs.release.outputs.core }}"
          echo "=== web-framework v${VERSION} 업데이트 ==="

          # 캐시 정리 후 강제 업데이트 (캐시로 인한 오래된 버전 문제 방지)
          pnpm store prune
          pnpm update "@apps-in-toss/web-framework@${VERSION}" --force --registry https://registry.npmjs.org

          # 설치된 버전 검증
          INSTALLED_VERSION=$(pnpm list @apps-in-toss/web-framework --json | jq -r '.[0].dependencies["@apps-in-toss/web-framework"].version')
          echo "요청 버전: ${VERSION}"
          echo "설치된 버전: ${INSTALLED_VERSION}"
          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "::error::버전 불일치! 요청: ${VERSION}, 설치됨: ${INSTALLED_VERSION}"
            exit 1
          fi
          echo "✅ 버전 검증 완료: ${INSTALLED_VERSION}"

          echo "SDK 코드 생성 중..."
          pnpm generate

          echo "SDK 코드 생성 완료"

      # 기준 파일의 값을 루트 package.json(.version), 생성기·BuildConfig package.json,
      # PNPM_VERSION에 쓰고 모두 일치하는지 다시 검사한다. BuildConfig~는 빌드 시 ait-build/로
      # 복사되어 실제 번들되는 웹 런타임을 정하므로, 백필 때도 대상 버전으로 함께 맞춰진다.
      - name: 버전 파일 동기화
        run: |
          node .github/scripts/sdk-update/sync-sdk-versions.cjs apply
          node .github/scripts/sdk-update/sync-sdk-versions.cjs check

      - name: BuildConfig pnpm-lock.yaml 업데이트
        run: |
          cd WebGLTemplates/AITTemplate/BuildConfig~
          pnpm install --no-frozen-lockfile
          echo "BuildConfig pnpm-lock.yaml 업데이트 완료"

      - name: Git 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 릴리즈용 테스트 코드 제외
        run: |
          echo "=== 릴리즈 빌드용 테스트 코드 제외 ==="

          SHARED_RUNTIME="Tests~/E2E/SharedScripts/Runtime"

          # SharedScripts/Runtime의 .cs 파일 삭제 (API 호환성 문제가 있는 코드)
          # .cs.meta도 함께 삭제 — 남기면 Unity가 orphan meta 경고를 20줄 넘게 쏟아내
          # 실제 컴파일 오류를 가린다. 아래에서 재생성하는 스텁 2종의 .meta는 GUID 유지를 위해 보존.
          if [ -d "$SHARED_RUNTIME" ]; then
            echo "SharedScripts/Runtime .cs 파일 삭제 중..."
            find "$SHARED_RUNTIME" -name "*.cs" -type f -delete
            find "$SHARED_RUNTIME" -name "*.cs.meta" -type f \
              ! -name "E2EBootstrapper.cs.meta" \
              ! -name "E2EBootstrapperHelper.cs.meta" \
              -delete
          fi

          # EditMode 테스트 삭제
          # 릴리즈 빌드는 테스트를 실행하지 않지만 패키지 안에 있으면 컴파일은 된다.
          # AppsInTossEditModeTests asmdef가 Runtime asmdef를 참조하므로, EditMode 테스트가
          # 위에서 지운 Runtime 타입을 하나라도 쓰면 빌드 전체가 CS0246으로 깨진다
          # (SDKAPIReflectionTests → APITestCatalog: v3.0.4 릴리즈 실패 원인).
          EDITMODE_TESTS="Tests~/E2E/SharedScripts/Editor/EditModeTests"
          if [ -d "$EDITMODE_TESTS" ]; then
            echo "SharedScripts/Editor/EditModeTests 삭제 중..."
            rm -rf "$EDITMODE_TESTS" "${EDITMODE_TESTS}.meta"
          fi

          # E2EBuildRunner.cs가 의존하는 최소 스텁 파일 생성
          # E2EBootstrapperHelper.cs (E2EBuildRunner에서 AddComponent로 사용)
          cat > "${SHARED_RUNTIME}/E2EBootstrapperHelper.cs" << 'STUB_EOF'
          using UnityEngine;
          // 릴리즈 빌드용 스텁 - 실제 기능 없음
          public class E2EBootstrapperHelper : MonoBehaviour
          {
              void Start() { }
          }
          STUB_EOF

          # E2EBootstrapper.cs (E2EBootstrapperHelper에서 호출)
          cat > "${SHARED_RUNTIME}/E2EBootstrapper.cs" << 'STUB_EOF'
          using UnityEngine;
          // 릴리즈 빌드용 스텁 - 실제 기능 없음
          public static class E2EBootstrapper
          {
              public static void Initialize() { }
          }
          STUB_EOF

          echo "스텁 파일 생성 완료"
          echo ""
          echo "SharedScripts/Runtime 내용:"
          ls -la "$SHARED_RUNTIME"

          # Plugins 폴더 .cs 파일 삭제
          SHARED_PLUGINS="Tests~/E2E/SharedScripts/Plugins"
          if [ -d "$SHARED_PLUGINS" ]; then
            find "$SHARED_PLUGINS" -name "*.cs" -type f -delete
          fi

          echo ""
          echo "SharedScripts Editor 폴더 확인:"
          ls -la Tests~/E2E/SharedScripts/Editor/

      - name: Orphan Commit 생성 및 Push
        id: commit
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          CORE="${{ needs.release.outputs.core }}"
          # refs/heads/ 경로 사용 (refs/builds/는 GitHub GC에 의해 삭제될 수 있음)
          BUILD_REF="refs/heads/_build/release-v${VERSION}"

          echo "=== Orphan Commit 생성 ==="

          # 모든 변경사항을 staging에 추가
          git add -A

          # Orphan commit 생성 (부모 없는 커밋)
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "빌드: SDK v${VERSION} 재생성

          - @apps-in-toss/web-framework v${CORE} 기반 SDK 코드 재생성
          - package.json 버전 동기화

          Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)")

          echo "Orphan commit SHA: ${COMMIT}"

          # 임시 ref로 push (main은 건드리지 않음)
          git push origin "${COMMIT}:${BUILD_REF}" --force

          echo "ref=${BUILD_REF}" >> $GITHUB_OUTPUT
          echo "sha=${COMMIT}" >> $GITHUB_OUTPUT
          echo "Orphan commit push 완료: ${BUILD_REF}"

  # =====================================================
  # 빌드 매트릭스 준비
  # =====================================================
  prepare-build-matrix:
    name: 빌드 매트릭스 준비
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.skip != 'true'

    outputs:
      macos-versions: ${{ steps.matrix.outputs.macos_versions }}
      windows-versions: ${{ steps.matrix.outputs.windows_versions }}
      skip-windows: ${{ steps.matrix.outputs.skip_windows }}
      skip-build: ${{ steps.matrix.outputs.skip_build }}

    steps:
      - name: 빌드 매트릭스 결정
        id: matrix
        run: |
          # push 이벤트(update/ 브랜치 머지)는 E2E에서 이미 검증되었으므로 minimal 빌드
          if [ "${{ github.event_name }}" = "push" ]; then
            STRATEGY="minimal"
          else
            STRATEGY="${{ inputs.build_strategy || 'minimal' }}"
          fi
          echo "빌드 전략: ${STRATEGY}"

          case "$STRATEGY" in
            full)
              MACOS='["2021.3","2022.3","6000.0","6000.3","6000.6"]'
              WINDOWS='["2021.3","2022.3","6000.0","6000.3","6000.6"]'
              SKIP_WIN=false
              SKIP_BUILD=false
              ;;
            standard)
              MACOS='["2021.3","6000.0","6000.3"]'
              WINDOWS='["2022.3","6000.6"]'
              SKIP_WIN=false
              SKIP_BUILD=false
              ;;
            minimal)
              MACOS='["2021.3"]'
              # Windows placeholder — 빈 배열은 매트릭스 파싱 에러 유발, skip-windows=true로 실제 실행은 스킵됨
              WINDOWS='["2021.3"]'
              SKIP_WIN=true
              SKIP_BUILD=false
              ;;
            skip-build)
              MACOS='["2021.3"]'
              WINDOWS='["2021.3"]'
              SKIP_WIN=true
              SKIP_BUILD=true
              ;;
            *)
              echo "::error::알 수 없는 빌드 전략: ${STRATEGY}"
              exit 1
              ;;
          esac

          echo "macos_versions=${MACOS}" >> $GITHUB_OUTPUT
          echo "windows_versions=${WINDOWS}" >> $GITHUB_OUTPUT
          echo "skip_windows=${SKIP_WIN}" >> $GITHUB_OUTPUT
          echo "skip_build=${SKIP_BUILD}" >> $GITHUB_OUTPUT

          echo "${STRATEGY}: macOS=${MACOS}, Windows=${WINDOWS}, skip_windows=${SKIP_WIN}, skip_build=${SKIP_BUILD}"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 빌드 매트릭스" >> $GITHUB_STEP_SUMMARY
          echo "- **전략**: ${STRATEGY}" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIP_BUILD" = "true" ]; then
            echo "- **macOS**: 스킵" >> $GITHUB_STEP_SUMMARY
            echo "- **Windows**: 스킵" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **macOS**: ${MACOS}" >> $GITHUB_STEP_SUMMARY
            if [ "$SKIP_WIN" = "true" ]; then
              echo "- **Windows**: 스킵" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Windows**: ${WINDOWS}" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # =====================================================
  # AIT 빌드 - macOS
  # macOS runner 라이선스 문제 시 Windows로 폴백
  # =====================================================
  build-ait-macos:
    name: AIT 빌드 (macOS)
    needs: [release, regenerate-sdk, prepare-build-matrix]
    if: needs.release.outputs.skip != 'true' && needs.prepare-build-matrix.outputs.skip-build != 'true'

    # ref-cancel: 같은 ref의 이전 호출만 정리. 머신 분배는 GH Actions 자체가 담당.
    concurrency:
      group: release-${{ github.workflow }}-${{ needs.regenerate-sdk.outputs.ref }}-macos-${{ matrix.unity-version }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        unity-version: ${{ fromJSON(needs.prepare-build-matrix.outputs.macos-versions) }}

    uses: ./.github/workflows/unity-build.yml
    with:
      ref: ${{ needs.regenerate-sdk.outputs.ref }}
      # afbbd23(2026-03)에서 macOS 러너 라이선스 hang 회피로 windows로 임시
      # 전환했던 잔재를 원복. 근본 원인은 #559(unity-<version> 라벨 1:1 머신 핀)로
      # 해결됐고, beta-release/preview는 이미 macOS 러너에서 정상 빌드 중.
      os: macos
      unity-version: ${{ matrix.unity-version }}
      web-framework-version: ${{ needs.release.outputs.core }}
      sdk-version: ${{ needs.release.outputs.version }}
      run-build: true
      # 이 산출물은 deploy-ait에서 ait deploy로 실 릴리즈 콘솔에 배포되므로
      # E2E 고속 프로필(dev build)을 끄고 SDK 기본 프로필(release 빌드)로 빌드한다.
      # dev 빌드 wasm(6000.x ~134MiB)은 콘솔 번들 크기 제한을 초과해 서버측
      # BUILD_FAILED가 난다 (2026-06 진단).
      fast-build: false
    secrets:
      AIT_AD_INTERSTITIAL_ID: ${{ secrets.AIT_AD_INTERSTITIAL_ID }}
      AIT_AD_REWARDED_ID: ${{ secrets.AIT_AD_REWARDED_ID }}
      AIT_AD_BANNER_TEXT_ID: ${{ secrets.AIT_AD_BANNER_TEXT_ID }}
      AIT_AD_BANNER_IMAGE_ID: ${{ secrets.AIT_AD_BANNER_IMAGE_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  # =====================================================
  # AIT 빌드 - Windows
  # =====================================================
  build-ait-windows:
    name: AIT 빌드 (Windows)
    needs: [release, regenerate-sdk, prepare-build-matrix]
    if: needs.release.outputs.skip != 'true' && needs.prepare-build-matrix.outputs.skip-windows != 'true'

    concurrency:
      group: release-${{ github.workflow }}-${{ needs.regenerate-sdk.outputs.ref }}-windows-${{ matrix.unity-version }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        unity-version: ${{ fromJSON(needs.prepare-build-matrix.outputs.windows-versions) }}

    uses: ./.github/workflows/unity-build.yml
    with:
      ref: ${{ needs.regenerate-sdk.outputs.ref }}
      os: windows
      unity-version: ${{ matrix.unity-version }}
      web-framework-version: ${{ needs.release.outputs.core }}
      sdk-version: ${{ needs.release.outputs.version }}
      run-build: true
      # macOS 빌드와 동일한 release 프로필 — 배포 대상 산출물은 dev 프로필 금지.
      fast-build: false
    secrets:
      AIT_AD_INTERSTITIAL_ID: ${{ secrets.AIT_AD_INTERSTITIAL_ID }}
      AIT_AD_REWARDED_ID: ${{ secrets.AIT_AD_REWARDED_ID }}
      AIT_AD_BANNER_TEXT_ID: ${{ secrets.AIT_AD_BANNER_TEXT_ID }}
      AIT_AD_BANNER_IMAGE_ID: ${{ secrets.AIT_AD_BANNER_IMAGE_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  # =====================================================
  # EditMode 게이트
  # 아래 AIT 빌드는 테스트 코드를 지운 orphan ref로 빌드하므로, 이 버전에서 API가
  # 실제로 컴파일·동작하는지는 확인하지 못한다. 그래서 main을 이 버전으로 다시 생성해
  # EditMode 테스트를 먼저 돌리고, 통과한 버전만 태그를 만든다.
  # sdk-version-override(생성기 재생성)는 3.x만 받으므로 3.x가 아닌 버전은 건너뛴다.
  # =====================================================
  editmode-gate:
    name: EditMode 게이트
    needs: release
    if: needs.release.outputs.skip != 'true' && startsWith(needs.release.outputs.core, '3.')

    concurrency:
      group: release-${{ github.workflow }}-editmode-gate-${{ needs.release.outputs.version }}
      cancel-in-progress: false

    uses: ./.github/workflows/unity-build.yml
    with:
      ref: ${{ needs.release.outputs.source_sha }}
      os: macos
      # 지원 범위의 가장 오래된 Unity. 버전별 API 차이는 C# 컴파일 단계에서 드러나므로 한 버전으로 충분하다.
      unity-version: '2021.3'
      run-build: false
      run-editmode-test: true
      test-level: '0'
      # 생성기 재생성과 BuildConfig 핀은 web-framework 버전(core)을 쓴다
      sdk-version-override: ${{ needs.release.outputs.core }}
      # EditMode 아티팩트 이름에 릴리스 버전을 붙인다.
      sdk-version: ${{ needs.release.outputs.version }}
    secrets:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  # =====================================================
  # 릴리즈 커밋 준비 (UPM 패키지 정리 포함)
  # EditMode 게이트와 AIT 빌드가 성공한 뒤에만 실행 → 테스트·빌드 실패 시 릴리즈 방지
  # main branch는 건드리지 않고 orphan commit 을 임시 _build/ 브랜치에만 올린다.
  # 태그·Release 같은 공개 ref 는 여기서 만들지 않는다 (publish-release 가 승인 뒤에 만든다).
  # =====================================================
  prepare-release-commit:
    name: 릴리즈 커밋 준비
    runs-on: ubuntu-latest
    needs: [release, regenerate-sdk, editmode-gate, build-ait-macos, build-ait-windows]
    if: |
      always() &&
      needs.release.outputs.skip != 'true' &&
      needs.regenerate-sdk.result == 'success' &&
      (needs.editmode-gate.result == 'success' || (needs.editmode-gate.result == 'skipped' && !startsWith(needs.release.outputs.core, '3.'))) &&
      (needs.build-ait-macos.result == 'success' || needs.build-ait-macos.result == 'skipped') &&
      (needs.build-ait-windows.result == 'success' || needs.build-ait-windows.result == 'skipped')
    # _build/ 임시 브랜치를 push 한다
    permissions:
      contents: write

    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      ref: ${{ steps.commit.outputs.ref }}
      release_datetime: ${{ steps.release-info.outputs.release_datetime }}
      commit_hash: ${{ steps.release-info.outputs.commit_hash }}

    steps:
      - name: Checkout (Orphan Ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.regenerate-sdk.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 정보 주입
        id: release-info
        env:
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          RELEASE_DATETIME=$(date -u +"%Y%m%d_%H%M")
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)

          echo "=== 릴리즈 정보 주입 ==="
          echo "릴리즈 일시: ${RELEASE_DATETIME}"
          echo "커밋 해시: ${COMMIT_HASH}"
          echo "리비전: +${REVISION}"

          echo "release_datetime=${RELEASE_DATETIME}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"

          # package.json description 업데이트
          # 런타임은 AITVersion.LoadVersionInfoEditor 가 이 description 을 정규식으로
          # 파싱해 ReleaseDateTime/CommitHash/리비전을 읽는다 (UPM 설치 환경에서의 채널).
          # package.json 의 version 은 core 그대로 두고, 리비전(+N)은 여기와 태그 이름에만 싣는다.
          # 로컬/임베디드/플레이어 경로는 빌드 시 Editor 가 Assets/Resources/AITVersionInfo.json
          # 을 생성하는 방식(Resources) 으로 분리되어 있어 이 워크플로우는 .cs 를 건드리지 않는다.
          jq --arg dt "$RELEASE_DATETIME" --arg hash "$COMMIT_HASH" --arg rev "+${REVISION}" \
             '.description = "Apps in Toss Mini App Unity Engine Adapter SDK Package. (Released: " + $dt + ", " + $hash + ", " + $rev + ")"' \
             package.json > tmp.json && mv tmp.json package.json

          echo "package.json description:"
          jq -r '.description' package.json

      - name: UPM 패키지 정리
        run: |
          echo "=== UPM 패키지 정리 ==="

          # 불필요한 디렉토리 제거 (~ 접미사 디렉토리는 Unity가 무시하므로 .meta 없음)
          rm -rf .github/
          rm -rf Tests~/
          rm -rf Tools~/
          rm -rf sdk-runtime-generator~/
          rm -rf scripts~/

          # 불필요한 파일 제거
          rm -f .gitignore
          rm -f CLAUDE.md
          rm -f run-local-tests.sh

          # 해당 .meta 파일도 제거
          rm -f .gitignore.meta
          rm -f CLAUDE.md.meta
          rm -f run-local-tests.sh.meta

          echo "정리된 파일 목록:"
          ls -la
          echo ""
          echo "Runtime/ 내용:"
          ls -la Runtime/ || true
          echo ""
          echo "Editor/ 내용:"
          ls -la Editor/ || true

      - name: Git 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 버전 정합성 검증 (릴리즈 커밋 생성 전 게이트)
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CORE: ${{ needs.release.outputs.core }}
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          BUILDCONFIG_PKG="WebGLTemplates/AITTemplate/BuildConfig~/package.json"

          # 릴리즈의 불변식: 루트 package.json의 version 은 web-framework 버전(core)이고,
          # BuildConfig~ 의 @apps-in-toss/web-framework 핀과 반드시 같아야 한다.
          # BuildConfig~ 는 빌드 시 ait-build/ 로 복사되어 실제 번들되는 웹 런타임을 결정하므로,
          # 이 둘이 갈리면 "vX.Y.Z 태그인데 다른 버전의 웹 런타임이 설치되는" 태그가 출하된다.
          # 리비전(+N)은 package.json version 에 넣지 않으므로 core 와 비교한다.
          PKG_VERSION=$(jq -r '.version' package.json)
          WF_PIN=$(jq -r '.dependencies["@apps-in-toss/web-framework"]' "$BUILDCONFIG_PKG")
          DESCRIPTION=$(jq -r '.description' package.json)

          echo "루트 package.json version : ${PKG_VERSION}"
          echo "BuildConfig web-framework : ${WF_PIN}"
          echo "릴리즈 대상 버전          : ${VERSION} (core ${CORE})"
          echo "package.json description  : ${DESCRIPTION}"

          if [ "$PKG_VERSION" != "$CORE" ]; then
            echo "::error::루트 package.json version(${PKG_VERSION})이 릴리즈 대상 web-framework 버전(${CORE})과 다릅니다. package.json 의 version 에는 리비전(+N)을 넣지 않습니다."
            exit 1
          fi

          if [ "$WF_PIN" != "$CORE" ]; then
            echo "::error::BuildConfig~ 의 @apps-in-toss/web-framework 핀(${WF_PIN})이 릴리즈 대상 버전(${CORE})과 다릅니다. 이 상태로 릴리즈하면 잘못된 웹 런타임이 번들됩니다."
            exit 1
          fi

          if ! [[ "$DESCRIPTION" =~ \(Released:\ [0-9]{8}_[0-9]{4},\ [0-9a-f]{7},\ \+${REVISION}\)$ ]]; then
            echo "::error::package.json description 의 릴리즈 표기가 예상과 다릅니다 (기대: 끝이 ', +${REVISION})'): ${DESCRIPTION}"
            exit 1
          fi

          # web-framework 외 @apps-in-toss 핀도 함께 본다.
          #
          # 기준 파일의 동반 패키지 버전은 "@apps-in-toss/<pkg>@CORE 이 npm에 있으면 CORE,
          # 없으면 그 패키지의 latest"로 정해진다(sync-sdk-versions.cjs resolve). 여기서 그 대우를 검사한다 —
          # 해당 버전이 npm에 존재하는데 핀이 다르면 동기화가 누락된 것이므로 막는다.
          # (존재하지 않으면 핀이 달라도 정상이다. 구버전 백필에서 흔하다.)
          FAILED=0
          for PKG in devtools; do
            PIN=$(jq -r --arg k "@apps-in-toss/${PKG}" '.dependencies[$k] // .devDependencies[$k] // "none"' "$BUILDCONFIG_PKG")
            [ "$PIN" = "none" ] && continue
            if npm view "@apps-in-toss/${PKG}@${CORE}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              if [ "$PIN" != "$CORE" ]; then
                echo "::error::@apps-in-toss/${PKG}@${CORE} 이 npm에 존재하는데 BuildConfig 핀은 ${PIN} 입니다 — 동기화 누락."
                FAILED=1
              else
                echo "  ${PKG}: ${PIN} (일치)"
              fi
            else
              echo "  ${PKG}: ${PIN} (npm에 ${CORE} 없음 — 검사 생략)"
            fi
          done

          # 핀이 가리키는 버전이 실제로 설치 가능한지 확인한다.
          #
          # 2026-07 사례: @apps-in-toss 2.10.7 이 게시 직후 unpublish 되었는데, 그 사이에
          # 돌던 자동화들이 해당 버전을 핀/lockfile 에 새겨 넣었다. 존재하지 않는 버전이
          # BuildConfig 에 박히면 그 태그를 설치한 환경에서 ERR_PNPM_FETCH_404 가 난다.
          #
          # ⚠️ 한계: 이 조회는 러너가 붙는 CDN 엣지의 응답에 의존한다. npm 의 unpublish 퍼지는
          #    엣지마다 비동기로 전파되므로, 아직 해당 버전을 서빙하는 엣지에서 실행되면
          #    통과할 수 있다. 완전한 방어가 아니라 "이미 전파된 유령 버전"을 잡는 그물이다.
          for PKG in $(jq -r '.dependencies | keys[] | select(startswith("@apps-in-toss/"))' "$BUILDCONFIG_PKG"); do
            PIN=$(jq -r --arg k "$PKG" '.dependencies[$k]' "$BUILDCONFIG_PKG")
            if ! npm view "${PKG}@${PIN}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "::error::${PKG}@${PIN} 을 npm에서 찾을 수 없습니다 — 존재하지 않는 버전을 핀한 채로 릴리즈할 수 없습니다."
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "✅ 버전 정합성 검증 통과: ${VERSION}"

      - name: 릴리즈 커밋 생성 (Orphan Commit)
        id: commit
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CORE: ${{ needs.release.outputs.core }}
        run: |
          # 태그와 Release 는 publish-release 가 승인 뒤에 만든다. 여기서는 커밋만 만들어 임시 브랜치에 올린다.
          PACKAGE_REF="refs/heads/_build/release-v${VERSION}-package"

          echo "=== 릴리즈 커밋 생성: v${VERSION} ==="

          # 정리된 상태로 새 orphan commit 생성
          git add -A
          TREE=$(git write-tree)
          RELEASE_COMMIT=$(git commit-tree "$TREE" -m "릴리즈: v${VERSION} (UPM 패키지)

          Apps in Toss Unity SDK v${VERSION}
          - @apps-in-toss/web-framework v${CORE} 기반
          - UPM 패키지용 정리된 릴리즈
          - 개발/테스트 파일 제외

          Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)")

          echo "릴리즈 commit SHA: ${RELEASE_COMMIT}"

          # 재실행해도 같은 이름의 임시 브랜치를 새 커밋으로 덮어쓴다 (공개 ref 가 아니다)
          git push origin "${RELEASE_COMMIT}:${PACKAGE_REF}" --force

          echo "sha=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "ref=${PACKAGE_REF}" >> "$GITHUB_OUTPUT"

  # =====================================================
  # 릴리즈 게시 (고정 태그 → GitHub Release → 별칭 이동)
  # environment `release` 의 승인을 받은 뒤에만 실행한다. 빌드와 테스트 게이트가 모두 끝난 다음,
  # 공개 ref 를 만들기 직전이 승인 지점이다.
  # =====================================================
  publish-release:
    name: 릴리즈 게시
    runs-on: ubuntu-latest
    needs: [release, regenerate-sdk, prepare-release-commit]
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag_name }}
    permissions:
      contents: write

    outputs:
      version: ${{ needs.release.outputs.version }}
      core: ${{ needs.release.outputs.core }}
      tag_name: ${{ needs.release.outputs.tag_name }}
      alias_name: ${{ needs.release.outputs.alias_name }}

    steps:
      # 스크립트는 워크플로 실행 커밋에서 읽는다 (릴리즈 커밋은 .github/ 가 지워진 orphan 커밋이다)
      - name: Checkout (릴리즈 스크립트)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          sparse-checkout: |
            .github/scripts/release
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 별칭 사전 검사
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALIAS_NAME: ${{ needs.release.outputs.alias_name }}
        run: |
          # 승인을 기다리는 동안 상태가 바뀌었을 수 있으니 공개 ref 를 만들기 전에 한 번 더 본다
          bash .github/scripts/release/release-refs.sh check-alias "$ALIAS_NAME"

      - name: 고정 태그 생성
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.prepare-release-commit.outputs.sha }}
        run: |
          # 이미 있으면 실패한다. 고정 태그는 옮기거나 지우지 않는다.
          bash .github/scripts/release/release-refs.sh create-tag "$TAG_NAME" "$RELEASE_SHA"

      - name: GitHub Release 생성 (draft)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          CORE: ${{ needs.release.outputs.core }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          ALIAS_NAME: ${{ needs.release.outputs.alias_name }}
          RELEASE_SHA: ${{ needs.prepare-release-commit.outputs.sha }}
          RELEASE_DATETIME: ${{ needs.prepare-release-commit.outputs.release_datetime }}
        run: |
          SHORT_SHA="${RELEASE_SHA:0:7}"

          RELEASE_BODY=$(cat <<EOF
          ## Apps in Toss Unity SDK v${VERSION}

          📅 **Released**: ${RELEASE_DATETIME} (UTC)
          🔗 **Commit**: [\`${SHORT_SHA}\`](https://github.com/${REPO}/commit/${RELEASE_SHA})

          \`@apps-in-toss/web-framework\` v${CORE} 기반으로 생성된 Unity SDK입니다.

          ### 설치 방법

          \`Packages/manifest.json\`에 다음을 추가하세요. 이 리비전에 고정됩니다.

          \`\`\`json
          {
            "dependencies": {
              "im.toss.apps-in-toss-unity-sdk": "https://github.com/${REPO}.git#${TAG_NAME}"
            }
          }
          \`\`\`

          \`#${ALIAS_NAME}\`을 쓰면 v${CORE}의 가장 최근 리비전을 따라갑니다.

          ### 지원 Unity 버전

          | 버전 | 상태 |
          |------|------|
          | Unity 6000.6 (Unity 6.6) | ✅ 지원 |
          | Unity 6000.3 (Unity 6.3 LTS) | ✅ 지원 |
          | Unity 6000.0 (Unity 6 LTS) | ✅ 지원 |
          | Unity 2022.3 LTS | ✅ 지원 |
          | Unity 2021.3 LTS | ✅ 지원 (최소 버전) |

          ### 주요 기능

          - Apps in Toss 플랫폼에 최적화된 WebGL 빌드 자동화
          - 커스텀 Build & Deploy 윈도우를 통한 Unity Editor 통합
          - 플랫폼별 브릿지 코드가 포함된 커스텀 WebGL 템플릿 (AITTemplate)
          - granite 빌드 시스템을 사용한 Vite 기반 빌드 파이프라인
          - 플랫폼 기능을 위한 종합 C# API (결제, 사용자 인증, 기기 API 등)

          ### 문서

          - [Unity Editor 설정](https://github.com/${REPO}#readme)
          EOF
          )

          # prerelease 버전(예: 3.0.0-beta)이면 Latest로 표시되지 않게 한다 (게시 단계에서 make_latest=false)
          PRERELEASE=false
          if [[ "$CORE" == *-* ]]; then
            PRERELEASE=true
            echo "prerelease 버전 감지: ${VERSION} → Latest 표시 안 함"
          fi

          # 태그는 앞 단계에서 만들었다. draft 로 만들어 두고 아래에서 게시한다.
          RELEASE_ID=$(gh api "repos/${REPO}/releases" -X POST \
            -f "tag_name=${TAG_NAME}" \
            -f "name=v${VERSION}" \
            -f "body=${RELEASE_BODY}" \
            -F draft=true \
            -F "prerelease=${PRERELEASE}" \
            --jq '.id')
          echo "draft Release id: ${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          PRERELEASE: ${{ steps.draft.outputs.prerelease }}
        run: |
          # 안정 릴리스 중 (core, N) 이 가장 높을 때만 Latest 로 표시한다.
          # 리비전 없는 옛 릴리스는 N=0 으로 센다. 낮은 버전을 나중에 릴리즈해도 Latest 가 넘어가지 않는다.
          LATEST=false
          if [ "$PRERELEASE" != "true" ]; then
            LATEST=$(bash .github/scripts/release/release-refs.sh is-latest "$TAG_NAME")
          fi
          echo "make_latest=${LATEST}"

          gh api "repos/${REPO}/releases/${RELEASE_ID}" -X PATCH \
            -F draft=false \
            -f "make_latest=${LATEST}" \
            --silent

          echo "GitHub Release 게시 완료"
          echo "URL: https://github.com/${REPO}/releases/tag/${TAG_NAME}"

      - name: 별칭 이동
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          ALIAS_NAME: ${{ needs.release.outputs.alias_name }}
          RELEASE_SHA: ${{ needs.prepare-release-commit.outputs.sha }}
        run: |
          # Release 를 게시한 뒤에 옮긴다. 별칭에는 Release 를 붙이지 않는다.
          bash .github/scripts/release/release-refs.sh move-alias "$ALIAS_NAME" "$RELEASE_SHA" "$TAG_NAME"

      - name: 임시 빌드 ref 정리
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD_REF: ${{ needs.regenerate-sdk.outputs.ref }}
          PACKAGE_REF: ${{ needs.prepare-release-commit.outputs.ref }}
        run: |
          for REF in "$BUILD_REF" "$PACKAGE_REF"; do
            [ -n "$REF" ] || continue
            gh api "repos/${REPO}/git/${REF}" -X DELETE --silent 2>/dev/null \
              && echo "삭제: ${REF}" || echo "빌드 ref 정리 스킵 (이미 없거나 권한 없음): ${REF}"
          done

      - name: 릴리즈 요약
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          CORE: ${{ needs.release.outputs.core }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          ALIAS_NAME: ${{ needs.release.outputs.alias_name }}
        run: |
          {
            echo "## 릴리즈 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "|------|-----|"
            echo "| 버전 | v${VERSION} |"
            echo "| 고정 태그 | \`${TAG_NAME}\` |"
            echo "| 별칭 | \`${ALIAS_NAME}\` (v${CORE}의 최신 리비전을 따라감) |"
            echo "| 릴리즈 | [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME}) |"
            echo ""
            echo "### UPM 설치"
            echo ""
            echo "이 리비전에 고정:"
            echo ""
            echo "\`\`\`"
            echo "https://github.com/${REPO}.git#${TAG_NAME}"
            echo "\`\`\`"
            echo ""
            echo "v${CORE}의 최신 리비전을 따라감:"
            echo ""
            echo "\`\`\`"
            echo "https://github.com/${REPO}.git#${ALIAS_NAME}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =====================================================
  # Sentry 릴리즈 등록 + 커밋 연동
  # =====================================================
  # 런타임 envelope 의 release 식별자(`apps-in-toss.unity@<version>`)와 동일한
  # 이름으로 Sentry 에 릴리즈를 등록하고 commit range 를 연결한다.
  # 이렇게 해야 PR 머지 메시지의 `Fixes APPS-IN-TOSS-UNITY-SDK-XX` trailer 가
  # Sentry GitHub Integration 을 통해 해당 이슈를 자동으로 resolve in next release
  # 로 표기하고, 다음 릴리즈가 배포되면 자동 closed 처리된다.
  sentry-release:
    name: Sentry 릴리즈 등록
    runs-on: ubuntu-latest
    needs: [publish-release]
    permissions:
      contents: read
    if: always() && needs.publish-release.result == 'success' && needs.publish-release.outputs.version != ''
    steps:
      - name: Checkout (main 커밋 히스토리)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sentry Release 생성 + 커밋 연동
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: toss
          SENTRY_PROJECT: apps-in-toss-unity-sdk
        with:
          # action-release@v3에서 `version`은 deprecated이고 `release`로 대체됨(동작 동일).
          release: apps-in-toss.unity@${{ needs.publish-release.outputs.version }}
          set_commits: auto
          finalize: true

  # =====================================================
  # AIT 패키지 배포
  # =====================================================
  deploy-ait:
    name: AIT 패키지 배포
    runs-on: ubuntu-latest
    needs: [build-ait-macos, build-ait-windows, publish-release]
    permissions:
      contents: read
    if: |
      always() &&
      needs.publish-release.result == 'success' &&
      (needs.build-ait-macos.result == 'success' || needs.build-ait-windows.result == 'success')
    timeout-minutes: 30

    steps:
      - name: Checkout (버전 참조용)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish-release.outputs.tag_name }}
          sparse-checkout: |
            WebGLTemplates/AITTemplate/BuildConfig~/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout .ci scripts
        # ref를 지정하지 않아 워크플로 YAML과 같은 커밋에서 스크립트를 읽는다.
        # 위 체크아웃은 릴리즈 태그(publish-release.outputs.tag_name)이고, 그
        # 태그는 .github/가 지워진 orphan 커밋이라 스크립트가 없다 — 배포 URL
        # 추출 헬퍼는 항상 이 워크플로 실행 커밋에서 읽는다.
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/deploy
          sparse-checkout-cone-mode: false
          path: .ci
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: WebGLTemplates/AITTemplate/BuildConfig~/package.json

      - name: Install AIT CLI
        run: |
          # 설치 버전은 "릴리즈 대상 버전"을 기준으로 삼는다.
          # 과거에는 태그에 실린 BuildConfig~ 핀을 그대로 읽었는데, 그 핀 자체가 오염 대상이라
          # 배포 검증이 오염된 값을 검증하는 자기참조 루프가 되어 결함을 영원히 통과시켰다.
          # web-framework 버전은 core 다 (릴리스 버전의 리비전 +N 은 npm 에 없다)
          WF_VERSION="${{ needs.publish-release.outputs.core }}"

          # 태그에 실린 핀이 대상 버전과 일치하는지 교차 확인 (prepare-release-commit 게이트의 이중 안전망)
          TAG_PIN=$(node -p "require('./WebGLTemplates/AITTemplate/BuildConfig~/package.json').dependencies['@apps-in-toss/web-framework']")
          if [ "$TAG_PIN" != "$WF_VERSION" ]; then
            echo "::error::태그의 web-framework 핀(${TAG_PIN})이 릴리즈 대상 버전(${WF_VERSION})과 다릅니다."
            exit 1
          fi

          echo "Installing @apps-in-toss/web-framework@${WF_VERSION}"
          pnpm install -g "@apps-in-toss/web-framework@${WF_VERSION}"
          ait --version || echo "AIT CLI installed"

      - name: AIT 빌드 결과물 다운로드
        uses: actions/download-artifact@v8
        with:
          pattern: ait-build-*-v${{ needs.publish-release.outputs.version }}
          path: ait-builds/

      - name: 다운로드된 빌드 확인
        id: check-packages
        run: |
          echo "=== 다운로드된 AIT 빌드 결과물 ==="
          if [ -d "ait-builds" ]; then
            echo "빌드 목록:"
            ls -la ait-builds/
            echo ""

            BUILD_COUNT=0
            for build_dir in ait-builds/ait-build-*/; do
              if [ -d "$build_dir" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "빌드: $(basename $build_dir)"
                ls -la "$build_dir"
                if [ -d "${build_dir}dist" ]; then
                  echo "dist/ 폴더:"
                  ls -la "${build_dir}dist" | head -10
                  BUILD_COUNT=$((BUILD_COUNT + 1))
                fi
              fi
            done

            echo "package_count=${BUILD_COUNT}" >> $GITHUB_OUTPUT

            if [ "$BUILD_COUNT" -gt 0 ]; then
              echo "✅ ${BUILD_COUNT}개 AIT 빌드 발견"
            else
              echo "::warning::유효한 AIT 빌드가 없습니다"
            fi
          else
            echo "::warning::ait-builds 디렉토리가 없습니다"
            echo "package_count=0" >> $GITHUB_OUTPUT
          fi

      - name: AIT 빌드 배포
        id: deploy
        if: steps.check-packages.outputs.package_count > 0
        env:
          AIT_DEPLOY_KEY: ${{ secrets.AIT_DEPLOY_KEY }}
        run: |
          VERSION="${{ needs.publish-release.outputs.version }}"

          echo "=== AIT 빌드 배포 ==="
          echo "버전: ${VERSION}"
          echo ""

          if [ -z "$AIT_DEPLOY_KEY" ]; then
            echo "::error::AIT_DEPLOY_KEY가 설정되지 않았습니다."
            echo "deploy_results=" >> $GITHUB_OUTPUT
            exit 1
          fi

          # 배포 결과 저장용 변수
          DEPLOY_RESULTS=""
          HAS_FAILURE=false

          for build_dir in ait-builds/ait-build-*/; do
            if [ -d "$build_dir" ]; then
              BUILD_NAME=$(basename "$build_dir")
              # ait-build-{os}-{unity-version} 형식에서 OS와 버전 추출
              OS=$(echo "$BUILD_NAME" | sed 's/ait-build-\([^-]*\)-.*/\1/')
              UNITY_VERSION=$(echo "$BUILD_NAME" | sed 's/ait-build-[^-]*-//')

              # OS 이름 정규화
              case "$OS" in
                macos) OS_DISPLAY="macOS" ;;
                windows) OS_DISPLAY="Windows" ;;
                *) OS_DISPLAY="$OS" ;;
              esac

              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "배포: ${OS_DISPLAY} - Unity ${UNITY_VERSION}"
              echo "경로: ${build_dir}"

              # ait deploy는 현재 디렉토리에서 실행되어야 함
              # dist/ 폴더 안에서 실행
              if [ -d "${build_dir}" ]; then
                echo "배포 디렉토리: ${build_dir}"

                # ait deploy 실행 (작업 디렉토리를 build_dir로 변경)
                # 5분(300초) 타임아웃 설정 - 배포 서버 응답 대기
                DEPLOY_OUTPUT=$(cd "${build_dir}" && timeout 300 ait deploy --api-key "$AIT_DEPLOY_KEY" -m "[CI] Release v${VERSION} (${OS_DISPLAY} · Unity ${UNITY_VERSION})" 2>&1) && DEPLOY_STATUS=0 || DEPLOY_STATUS=$?

                echo "$DEPLOY_OUTPUT"

                if [ $DEPLOY_STATUS -eq 124 ]; then
                  # timeout 명령어의 타임아웃 종료 코드
                  echo "❌ 배포 타임아웃 (5분 초과)"
                  DEPLOY_RESULTS="${DEPLOY_RESULTS}${OS_DISPLAY} - ${UNITY_VERSION}: TIMEOUT\n"
                  HAS_FAILURE=true
                elif [ $DEPLOY_STATUS -eq 0 ]; then
                  # 배포 성공 - URL 추출 시도 (ANSI 이스케이프 시퀀스 제거 후 파싱)
                  CLEANED_OUTPUT=$(echo "$DEPLOY_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' | tr -d '\r')
                  # 배포 URL 추출(박스 래핑 접합)과 host 파라미터 멱등 부가는
                  # .github/scripts/deploy/extract-deploy-url.sh로 옮겼다.
                  DEPLOY_URL=$(echo "$CLEANED_OUTPUT" | bash "$GITHUB_WORKSPACE/.ci/.github/scripts/deploy/extract-deploy-url.sh")

                  if [ -z "$DEPLOY_URL" ]; then
                    DEPLOY_URL=$(echo "$CLEANED_OUTPUT" | grep -oE 'https?://[^[:space:]]+' | head -1 || echo "SUCCESS")
                  fi
                  echo "✅ 배포 성공: ${DEPLOY_URL}"
                  DEPLOY_RESULTS="${DEPLOY_RESULTS}${OS_DISPLAY} - ${UNITY_VERSION}: ${DEPLOY_URL}\n"
                else
                  echo "❌ 배포 실패 (exit code: $DEPLOY_STATUS)"
                  DEPLOY_RESULTS="${DEPLOY_RESULTS}${OS_DISPLAY} - ${UNITY_VERSION}: FAILED\n"
                  HAS_FAILURE=true
                fi
              else
                echo "::warning::빌드 디렉토리가 없습니다: ${build_dir}"
                DEPLOY_RESULTS="${DEPLOY_RESULTS}${OS_DISPLAY} - ${UNITY_VERSION}: FAILED (no build dir)\n"
                HAS_FAILURE=true
              fi
            fi
          done

          # 결과 저장
          echo "deploy_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$DEPLOY_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$HAS_FAILURE" = true ]; then
            echo "has_failure=true" >> $GITHUB_OUTPUT
          else
            echo "has_failure=false" >> $GITHUB_OUTPUT
          fi

          # Step Summary 작성
          echo "## AIT 배포 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 플랫폼 | Unity 버전 | 상태 | URL | QR |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|------|-----|:--:|" >> $GITHUB_STEP_SUMMARY

          echo -e "$DEPLOY_RESULTS" | while IFS= read -r line; do
            if [ -n "$line" ]; then
              PLATFORM=$(echo "$line" | cut -d: -f1 | xargs)
              STATUS=$(echo "$line" | cut -d: -f2- | xargs)
              # PLATFORM 형식: "macOS - 2021.3" → OS와 Unity 버전 분리
              OS_NAME=$(echo "$PLATFORM" | cut -d'-' -f1 | xargs)
              UV=$(echo "$PLATFORM" | cut -d'-' -f2- | xargs)
              if [[ "$STATUS" == *"FAILED"* ]] || [[ "$STATUS" == *"TIMEOUT"* ]]; then
                echo "| ${OS_NAME} | ${UV} | ❌ | ${STATUS} | - |" >> $GITHUB_STEP_SUMMARY
              elif echo "$STATUS" | grep -qE '^intoss-private://'; then
                ENCODED_URL=$(printf '%s' "$STATUS" | jq -sRr @uri)
                QR_IMG="![QR](https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${ENCODED_URL})"
                echo "| ${OS_NAME} | ${UV} | ✅ | \`${STATUS}\` | ${QR_IMG} |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| ${OS_NAME} | ${UV} | ✅ | ${STATUS} | - |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done

      - name: 배포 결과 아티팩트 저장
        if: always() && steps.check-packages.outputs.package_count > 0
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          DEPLOY_RESULTS: ${{ steps.deploy.outputs.deploy_results }}
          HAS_FAILURE: ${{ steps.deploy.outputs.has_failure }}
        run: |
          echo "version=${VERSION}" > deploy-results.txt
          echo "has_failure=${HAS_FAILURE}" >> deploy-results.txt
          echo "---RESULTS---" >> deploy-results.txt
          echo -e "$DEPLOY_RESULTS" >> deploy-results.txt

          echo "저장된 배포 결과:"
          cat deploy-results.txt

      - name: 배포 결과 아티팩트 업로드
        if: always() && steps.check-packages.outputs.package_count > 0
        uses: actions/upload-artifact@v7
        with:
          name: deploy-results-${{ needs.publish-release.outputs.version }}
          path: deploy-results.txt
          retention-days: 1

      - name: 배포 알림 전송
        if: always() && steps.check-packages.outputs.package_count > 0
        env:
          DEPLOY_WEBHOOK_URL: "https://ipd-public-gateway.core.toss-internal.com/api-public/v3/ipd-public-gateway/webhooks/ipd-corp-core-automation-webhook/8b6db539-6cb4-4b99-b2a8-8981c43b2592"
          VERSION: ${{ needs.publish-release.outputs.version }}
          DEPLOY_RESULTS: ${{ steps.deploy.outputs.deploy_results }}
        run: |

          if [ -z "$DEPLOY_RESULTS" ]; then
            URLS_FOR_EDITION="배포 결과 없음"
          else
            echo "=== markdown link 형식으로 변환 ==="
            URLS_FOR_EDITION=""
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                # "macOS - 2021.3: URL" 형식에서 플랫폼과 URL 분리
                PLATFORM=$(echo "$line" | cut -d: -f1 | xargs)
                URL=$(echo "$line" | cut -d: -f2- | xargs)

                if [ -n "$URL" ] && [ "$URL" != "FAILED" ] && [ "$URL" != "TIMEOUT" ]; then
                  LINE="${PLATFORM}: <${URL}|${VERSION}>"
                else
                  LINE="${PLATFORM}: ${VERSION}(${URL})"
                fi

                if [ -n "$URLS_FOR_EDITION" ]; then
                  URLS_FOR_EDITION="${URLS_FOR_EDITION}\n${LINE}"
                else
                  URLS_FOR_EDITION="${LINE}"
                fi
              fi
            done <<< "$(echo -e "$DEPLOY_RESULTS")"
          fi

          ACTIONS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "=== 배포 알림 전송 ==="
          echo "버전: ${VERSION}"
          echo "Actions URL: ${ACTIONS_URL}"
          echo "결과:"
          echo -e "$URLS_FOR_EDITION"

          # 1줄(1플랫폼)당 1필드로 분할
          # Slack section block에서 여러 링크가 한 필드에 있으면 렌더링 버그 발생하므로 분리
          LINES=()
          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            LINES+=("$line")
          done <<< "$(echo -e "$URLS_FOR_EDITION")"

          TOTAL_LINES=${#LINES[@]}
          echo "총 ${TOTAL_LINES}개 줄(플랫폼)로 분할"

          # 최대 에디션 수 (macOS/Windows x 5 Unity 버전 = 10)
          MAX_EDITION_LINES=10

          # jq로 안전한 JSON 생성
          # urlsForEdition (첫 번째), urlsForEdition2, ..., urlsForEditionN 필드로 전송
          # lineCount 필드로 총 줄 수 전달 (Slack 템플릿에서 반복 범위로 사용)
          JSON_PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg urls "${LINES[0]:-}" \
            --arg actionsUrl "$ACTIONS_URL" \
            --argjson lineCount "$TOTAL_LINES" \
            '{version: $version, urlsForEdition: $urls, actionsUrl: $actionsUrl, lineCount: $lineCount}')

          # urlsForEdition2 ~ urlsForEdition{MAX} 키를 항상 포함 (빈 문자열로 패딩)
          # 웹훅 수신 템플릿이 모든 키의 존재를 요구하므로, 실제 데이터 유무와 관계없이 전송
          for i in $(seq 2 $MAX_EDITION_LINES); do
            JSON_PAYLOAD=$(echo "$JSON_PAYLOAD" | jq \
              --arg key "urlsForEdition${i}" \
              --arg val "${LINES[$((i-1))]:-}" \
              '. + {($key): $val}')
          done

          echo "전송할 JSON:"
          echo "$JSON_PAYLOAD"

          # HTTP 상태 코드 확인하여 실패 처리
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ 알림 전송 완료 (HTTP ${HTTP_STATUS})"
          else
            echo "::error::알림 전송 실패 (HTTP ${HTTP_STATUS})"
            cat /tmp/webhook_response.txt
            exit 1
          fi
