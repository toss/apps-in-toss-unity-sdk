name: SDK Update Auto Rebase
run-name: "SDK Update Auto Rebase"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  # 필수 'scan' 체크를 bot PR 새 head에 재보고하기 위해 필요 (아래 'scan 체크 충족' step)
  statuses: write

concurrency:
  group: sdk-update-rebase
  cancel-in-progress: false

jobs:
  # =====================================================
  # Conflict가 있는 open update/ PR 감지
  # =====================================================
  detect-conflicts:
    name: Conflict PR 감지
    runs-on: ubuntu-latest
    outputs:
      has_conflicts: ${{ steps.detect.outputs.has_conflicts }}
      conflict_prs: ${{ steps.detect.outputs.conflict_prs }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Open update/ PR 중 conflict 감지
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== main 변경 감지: open update/ PR 리베이스 확인 ==="

          # main 의 SDK 버전. 이 버전 이하의 PR 은 이미 반영됐거나 대체된 것이라 리베이스하면
          # 기준 파일과 package.json 이 다운그레이드되므로 건드리지 않는다.
          MAIN_VERSION=$(jq -r '.sdkVersion // empty' .github/sdk-versions.json 2>/dev/null || echo "")
          echo "main SDK 버전: ${MAIN_VERSION:-알 수 없음}"

          # REST API로 open PR 목록 조회 (per_page=100으로 페이지네이션 대응)
          OPEN_PRS=$(gh api 'repos/${{ github.repository }}/pulls?state=open&per_page=100' \
            --jq '[.[] | select(.head.ref | startswith("update/")) | {number: .number, branch: .head.ref, author: .user.login}]')
          echo "Open update/ PRs: ${OPEN_PRS}"

          PR_COUNT=$(echo "$OPEN_PRS" | jq 'length')
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "열린 update/ PR이 없습니다"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "conflict_prs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 임시 파일로 서브셸 문제 회피
          TMPFILE=$(mktemp)
          echo "[]" > "$TMPFILE"

          for idx in $(seq 0 $((PR_COUNT - 1))); do
            PR_NUMBER=$(echo "$OPEN_PRS" | jq -r ".[$idx].number")
            PR_BRANCH=$(echo "$OPEN_PRS" | jq -r ".[$idx].branch")
            PR_AUTHOR=$(echo "$OPEN_PRS" | jq -r ".[$idx].author")

            # 버전 추출: update/{VERSION}-{TIMESTAMP}
            VERSION=$(echo "$PR_BRANCH" | sed 's|update/\([0-9]*\.[0-9]*\.[0-9]*\)-.*|\1|')
            if [ -z "$VERSION" ] || [ "$VERSION" = "$PR_BRANCH" ]; then
              echo "  PR #${PR_NUMBER}: 버전 추출 실패 (브랜치: ${PR_BRANCH}) - 스킵"
              continue
            fi

            if [ -n "$MAIN_VERSION" ] && \
               [ "$(printf '%s\n%s\n' "$VERSION" "$MAIN_VERSION" | sort -V | head -n1)" = "$VERSION" ]; then
              echo "  PR #${PR_NUMBER} (v${VERSION}): main(v${MAIN_VERSION}) 이하 버전이라 스킵 (다운그레이드 방지)"
              continue
            fi

            # 기준 파일(.github/sdk-versions.json)이 도입되기 전에 만든 PR 은 그 파일을 갱신하지
            # 않는다. 파일이 겹치지 않아 mergeable=true 여도 머지하면 기준 파일과 package.json 이
            # 어긋나므로, PR 브랜치에 기준 파일이 없거나 sdkVersion 이 PR 버전과 다르면
            # mergeable 과 무관하게 리베이스한다.
            NEEDS_SSOT="false"
            BRANCH_SDK_VERSION=$(gh api "repos/${{ github.repository }}/contents/.github/sdk-versions.json?ref=${PR_BRANCH}" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | jq -r '.sdkVersion // empty' 2>/dev/null || true)
            if [ "$BRANCH_SDK_VERSION" != "$VERSION" ]; then
              NEEDS_SSOT="true"
              echo "  PR #${PR_NUMBER} (v${VERSION}): 브랜치 기준 파일 sdkVersion='${BRANCH_SDK_VERSION:-없음}' → 기준 파일 반영을 위해 리베이스"
            fi

            # mergeable 상태 확인 (null이면 재시도)
            MERGEABLE="null"
            for i in 1 2 3; do
              MERGEABLE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.mergeable')
              if [ "$MERGEABLE" != "null" ]; then
                break
              fi
              echo "  PR #${PR_NUMBER}: mergeable 상태 대기 중... (${i}/3)"
              sleep 5
            done

            echo "  PR #${PR_NUMBER} (v${VERSION}): mergeable=${MERGEABLE}, author=${PR_AUTHOR}"

            # mergeable이 true이고 기준 파일도 반영돼 있으면 - 스킵
            if [ "$MERGEABLE" = "true" ] && [ "$NEEDS_SSOT" != "true" ]; then
              echo "    → conflict 없음, 스킵"
              continue
            fi

            # conflict가 있거나 판단 불가(null) → 재생성 대상
            jq -c --arg num "$PR_NUMBER" --arg branch "$PR_BRANCH" --arg version "$VERSION" --arg author "$PR_AUTHOR" \
              '. + [{"number": ($num | tonumber), "branch": $branch, "version": $version, "author": $author}]' \
              "$TMPFILE" > "${TMPFILE}.tmp" && mv "${TMPFILE}.tmp" "$TMPFILE"
          done

          CONFLICT_PRS=$(cat "$TMPFILE")
          rm -f "$TMPFILE"

          echo ""
          echo "Conflict PRs: ${CONFLICT_PRS}"
          COUNT=$(echo "$CONFLICT_PRS" | jq 'length')

          if [ "$COUNT" -gt 0 ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            # heredoc으로 multi-line safe하게 저장
            echo "conflict_prs<<CONFLICT_EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICT_PRS" >> $GITHUB_OUTPUT
            echo "CONFLICT_EOF" >> $GITHUB_OUTPUT
            echo "✅ ${COUNT}개의 PR에 대해 리베이스 필요"
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "conflict_prs=[]" >> $GITHUB_OUTPUT
            echo "✅ 리베이스가 필요한 PR이 없습니다"
          fi

      - name: 감지 결과 요약
        env:
          CONFLICT_PRS: ${{ steps.detect.outputs.conflict_prs }}
          HAS_CONFLICTS: ${{ steps.detect.outputs.has_conflicts }}
        run: |
          echo "## SDK Update Auto Rebase - 감지 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$HAS_CONFLICTS" = "true" ]; then
            echo "### 리베이스 대상 PR" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| PR | 버전 | 브랜치 |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "$CONFLICT_PRS" | jq -r '.[] | "| #\(.number) | v\(.version) | \(.branch) |"' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ 리베이스가 필요한 PR이 없습니다." >> $GITHUB_STEP_SUMMARY
          fi

  # =====================================================
  # SDK 재생성 및 force-push
  # =====================================================
  rebase:
    name: 리베이스 v${{ matrix.pr.version }} (PR #${{ matrix.pr.number }})
    runs-on: ubuntu-latest
    needs: detect-conflicts
    if: needs.detect-conflicts.outputs.has_conflicts == 'true'

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJson(needs.detect-conflicts.outputs.conflict_prs) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 버전 설정
        id: version
        env:
          PR_VERSION: ${{ matrix.pr.version }}
          PR_BRANCH: ${{ matrix.pr.branch }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          echo "version=${PR_VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${PR_BRANCH}" >> $GITHUB_OUTPUT
          echo "SDK v${PR_VERSION} 리베이스 시작 (PR #${PR_NUMBER}, 브랜치: ${PR_BRANCH})"

      - name: PR 상태 및 author 확인
        id: author-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ matrix.pr.author }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          # 감지 이후 update.yml 이 낮은 버전 PR을 닫고 브랜치를 지웠을 수 있다.
          # 닫힌 PR은 되살리지 않는다 (force 갱신이 지워진 브랜치를 다시 만들 수 있다).
          PR_STATE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state' || echo unknown)
          if [ "$PR_STATE" != "open" ]; then
            echo "::notice::PR #${PR_NUMBER}은 ${PR_STATE} 상태입니다. 자동 리베이스를 스킵합니다."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          AUTHOR="${PR_AUTHOR}"
          if [ "$AUTHOR" != "github-actions[bot]" ]; then
            echo "::warning::PR #${PR_NUMBER}은 ${AUTHOR}가 생성한 PR입니다. 자동 리베이스를 스킵합니다."
            echo "skip=true" >> $GITHUB_OUTPUT

            # 경고 코멘트 게시
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -X POST -f body="⚠️ **자동 리베이스 스킵**: 이 PR은 \`${AUTHOR}\`가 생성했으므로 자동 리베이스 대상이 아닙니다. 수동으로 rebase해주세요."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Git 설정
        if: steps.author-check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # update.yml 과 같은 스크립트·같은 규칙으로 동반 패키지 버전을 결정해 기준 파일
      # (.github/sdk-versions.json)에 기록한다. main 의 기준 파일 위에 이 PR 의 버전을 덮어쓴다.
      - name: 동반 패키지 버전 결정
        if: steps.author-check.outputs.skip != 'true'
        run: |
          node .github/scripts/sdk-update/sync-sdk-versions.cjs resolve \
            --version "${{ steps.version.outputs.version }}" \
            --registry https://registry.npmjs.org

      - name: web-framework 버전 업데이트 및 SDK 재생성
        if: steps.author-check.outputs.skip != 'true'
        id: generate
        working-directory: sdk-runtime-generator~
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "=== web-framework v${VERSION} 업데이트 ==="

          # 캐시 정리 후 강제 업데이트 (캐시로 인한 오래된 버전 문제 방지)
          pnpm store prune
          pnpm update "@apps-in-toss/web-framework@${VERSION}" --force --registry https://registry.npmjs.org

          # 설치된 버전 검증
          INSTALLED_VERSION=$(pnpm list @apps-in-toss/web-framework --json | jq -r '.[0].dependencies["@apps-in-toss/web-framework"].version')
          echo "요청 버전: ${VERSION}"
          echo "설치된 버전: ${INSTALLED_VERSION}"
          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "::error::버전 불일치! 요청: ${VERSION}, 설치됨: ${INSTALLED_VERSION}"
            exit 1
          fi
          echo "✅ 버전 검증 완료: ${INSTALLED_VERSION}"

          echo "SDK 코드 생성 중..."
          # 타입 검사 실패해도 계속 진행
          if pnpm generate; then
            echo "generate_status=success" >> $GITHUB_OUTPUT
            echo "SDK 코드 생성 완료"
          else
            echo "generate_status=failed" >> $GITHUB_OUTPUT
            echo "::warning::SDK 코드 생성 실패 - 수동 수정 필요"
          fi

      - name: 다중 버전 테스트 alias 추가
        if: steps.author-check.outputs.skip != 'true'
        working-directory: sdk-runtime-generator~
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ALIAS_KEY="web-framework-${VERSION}"

          # package.json devDependencies에 alias가 없으면 추가
          if ! jq -e ".devDependencies[\"${ALIAS_KEY}\"]" package.json > /dev/null 2>&1; then
            jq --arg key "$ALIAS_KEY" \
               --arg val "npm:@apps-in-toss/web-framework@${VERSION}" \
               '.devDependencies[$key] = $val' package.json > tmp.json
            mv tmp.json package.json
            echo "✅ 테스트 alias 추가: ${ALIAS_KEY}"
            pnpm install --no-frozen-lockfile
          else
            echo "⏭️ alias 이미 존재: ${ALIAS_KEY}"
          fi

      # 기준 파일의 값을 루트 package.json, 생성기 package.json, BuildConfig package.json,
      # PNPM_VERSION 에 쓰고, 모두 일치하는지 다시 검사한다.
      # (이전에는 이 워크플로의 jq 에 devtools 가 빠져 PR 이 devtools 를 main 값으로 되돌렸다.
      #  이제 update.yml 과 같은 스크립트가 같은 대상을 쓴다.)
      - name: 버전 파일 동기화
        if: steps.author-check.outputs.skip != 'true'
        run: |
          node .github/scripts/sdk-update/sync-sdk-versions.cjs apply
          node .github/scripts/sdk-update/sync-sdk-versions.cjs check

      - name: BuildConfig pnpm-lock.yaml 업데이트
        if: steps.author-check.outputs.skip != 'true'
        run: |
          cd WebGLTemplates/AITTemplate/BuildConfig~
          pnpm install --no-frozen-lockfile
          echo "BuildConfig pnpm-lock.yaml 업데이트 완료"

      - name: 변경 스테이징
        if: steps.author-check.outputs.skip != 'true'
        id: stage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GENERATE_STATUS="${{ steps.generate.outputs.generate_status }}"

          # 변경사항 확인 — 없으면 스테이징하지 않는다. 아래 signed-commit 액션은
          # 스테이징된 변경이 없으면 커밋을 만들지 않고 committed=false 로 끝난다.
          if git diff --quiet && git diff --staged --quiet; then
            echo "변경사항이 없습니다."
            exit 0
          fi

          # 모든 변경사항 스테이징 (signed-commit 액션이 스테이징된 index를 커밋한다)
          git add -A

          if [ "$GENERATE_STATUS" = "failed" ]; then
            SUFFIX=" (타입 오류 포함)"
          else
            SUFFIX=""
          fi

          {
            echo "message<<COMMIT_MESSAGE_EOF"
            echo "기능: SDK v${VERSION} 업데이트 (리베이스)${SUFFIX}"
            echo ""
            echo "- @apps-in-toss/web-framework v${VERSION} 기반 SDK 코드 재생성"
            echo "- main 브랜치 최신 상태 기반 리베이스"
            echo "- .github/sdk-versions.json 갱신 (web-framework/devtools)"
            echo "- package.json·BuildConfig package.json 버전 동기화"
            echo ""
            echo "자동 생성: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "COMMIT_MESSAGE_EOF"
          } >> $GITHUB_OUTPUT

      # SDK 재생성에 수 분이 걸리는 동안 update.yml 의 supersede 가 이 PR 을 닫고 브랜치를 지웠을 수
      # 있다. signed-commit(force)는 없는 ref 를 새로 만들므로, 커밋 직전에 한 번 더 확인한다.
      - name: 커밋 직전 PR 상태 재확인
        id: recheck
        if: steps.author-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          PR_STATE=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state' || echo unknown)
          if [ "$PR_STATE" != "open" ]; then
            echo "::notice::PR #${PR_NUMBER}은 ${PR_STATE} 상태입니다. 브랜치를 되살리지 않도록 커밋을 건너뜁니다."
            echo "closed=true" >> $GITHUB_OUTPUT
          else
            echo "closed=false" >> $GITHUB_OUTPUT
          fi

      # 기존 PR 브랜치를 main 기준으로 다시 만든 커밋 1개로 force 갱신한다.
      # git commit + git push --force 로 만든 bot 커밋은 서명이 없어 main Ruleset
      # (required_signatures)에 막혀 머지되지 않았다. REST git data API 커밋은 GitHub이
      # 자동 서명(Verified)하므로 composite action(force=true, PATCH git/refs force)으로 대체한다.
      - name: 기존 브랜치에 서명 커밋 force 갱신
        id: push
        if: steps.author-check.outputs.skip != 'true' && steps.recheck.outputs.closed != 'true'
        uses: ./.github/actions/signed-commit
        with:
          branch: ${{ steps.version.outputs.branch }}
          message: ${{ steps.stage.outputs.message }}
          force: "true"

      - name: PR에 리베이스 완료 코멘트
        if: steps.author-check.outputs.skip != 'true' && steps.push.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GENERATE_STATUS="${{ steps.generate.outputs.generate_status }}"

          if [ "$GENERATE_STATUS" = "failed" ]; then
            GENERATE_NOTE="
          > ⚠️ SDK 코드 생성 중 타입 검사 실패 — 수동 수정이 필요합니다."
          else
            GENERATE_NOTE=""
          fi

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -X POST -f body="♻️ **자동 리베이스 완료**: main 브랜치 최신 상태 기반으로 SDK v${VERSION} 코드를 재생성했습니다.${GENERATE_NOTE}"

      - name: E2E 테스트 트리거
        if: steps.author-check.outputs.skip != 'true' && steps.push.outputs.committed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          echo "E2E 테스트 트리거: PR #${PR_NUMBER}"
          jq -n --arg pr "${PR_NUMBER}" '{"ref":"main","inputs":{"target_ref":$pr}}' | \
            gh api "repos/${{ github.repository }}/actions/workflows/216286654/dispatches" \
            -X POST --input -
          echo "✅ E2E 테스트 트리거 완료: PR #${PR_NUMBER}"

      # 필수 'scan' 체크 충족. force-push로 head가 바뀌면 기존 scan status가
      # 무효화되는데, GITHUB_TOKEN bot PR은 string-check.yml을 트리거하지 못해
      # scan이 영구 pending → 머지 불가가 된다. 새 head에 scan=success를 재보고
      # (update.yml / update-changelog.yml과 같은 패턴).
      - name: 필수 scan 체크 충족 (bot PR)
        if: steps.author-check.outputs.skip != 'true' && steps.push.outputs.committed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ steps.push.outputs.commit-sha }}"
          gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" -X POST \
            -f state=success \
            -f context=scan \
            -f description="bot SDK 업데이트 PR(리베이스) — scan skipped (github-actions[bot])"
          echo "✅ scan status 보고 완료: ${HEAD_SHA}"

      - name: 실패 시 PR 코멘트
        if: failure() && steps.author-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            -X POST -f body="❌ **자동 리베이스 실패**: SDK v${VERSION} 재생성 중 오류가 발생했습니다. 수동으로 리베이스해주세요.

          [워크플로우 로그 확인](${RUN_URL})"

      - name: 리베이스 결과 요약
        if: always()
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SKIP="${{ steps.author-check.outputs.skip }}"
          PUSHED="${{ steps.push.outputs.committed }}"

          echo "## SDK Update Auto Rebase - v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SKIP" = "true" ]; then
            echo "⏭️ **스킵됨**: 이미 닫힌 PR이거나 bot이 아닌 사용자가 생성한 PR" >> $GITHUB_STEP_SUMMARY
          elif [ "$PUSHED" = "true" ]; then
            echo "✅ **리베이스 완료**: PR #${PR_NUMBER}" >> $GITHUB_STEP_SUMMARY
          elif [ "$PUSHED" = "false" ]; then
            echo "⏭️ **변경사항 없음**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **실패**" >> $GITHUB_STEP_SUMMARY
          fi
