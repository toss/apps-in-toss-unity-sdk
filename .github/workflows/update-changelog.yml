name: Update API Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-changelog:
    name: Update API Changelog Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        working-directory: sdk-runtime-generator~
        run: pnpm install --no-frozen-lockfile

      - name: Verify Multi-Version Parsing
        working-directory: sdk-runtime-generator~
        run: pnpm test:multi-version

      - name: Generate Report
        working-directory: sdk-runtime-generator~
        run: pnpm changelog:generate

      - name: Commit Report
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p 'Documentation~/changelog'
          cp sdk-runtime-generator~/reports/api-changelog.html 'Documentation~/changelog/index.html'
          cp sdk-runtime-generator~/reports/api-changelog.md 'Documentation~/changelog/api-changelog.md'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'Documentation~/changelog/'
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # 고정 브랜치 1개만 사용 → 열린 changelog PR은 항상 ≤1개.
          # (기존 타임스탬프 브랜치는 머지 실패 시 무한 누적되는 원인이었음)
          BRANCH="docs/auto-changelog"
          git checkout -b "$BRANCH"
          git commit -m "문서: API Changelog 리포트 자동 갱신"
          # force push: 기존 열린 PR이 있으면 in-place로 갱신, 없으면 새로 생성
          git push -u origin "$BRANCH" --force
          HEAD_SHA=$(git rev-parse HEAD)

          # 필수 'scan' 체크 충족.
          # GITHUB_TOKEN으로 만든 PR은 GitHub 정책상 워크플로(string-check.yml)를 트리거하지
          # 못해 scan이 영구 pending → 머지 불가였다. string-check.yml의 'bot PR → scan skip'
          # 정책과 동일하게, 봇이 만든 이 PR에 한해 scan=success를 직접 보고한다.
          gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" -X POST \
            -f state=success \
            -f context=scan \
            -f description="bot changelog PR — scan skipped (github-actions[bot])"

          # 열린 PR이 없을 때만 생성 (있으면 위 force-push로 이미 갱신됨)
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "문서: API Changelog 리포트 자동 갱신" \
              --body "API Changelog 리포트를 자동 갱신합니다." \
              --base main \
              --head "$BRANCH"
          fi

          # scan을 success로 보고했으므로 PR은 mergeable. merge-ref 계산 지연 대비 재시도.
          MERGED=false
          for attempt in 1 2 3; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              MERGED=true
              break
            fi
            echo "머지 시도 ${attempt}/3 실패 — 재시도"
            sleep 5
          done

          # 동기 머지가 실패하면 auto-merge로 예약 (required check 통과 시 자동 머지)
          if [ "$MERGED" != "true" ]; then
            echo "::warning::동기 머지 실패 — auto-merge로 예약 시도"
            gh pr merge "$BRANCH" --squash --delete-branch --auto \
              || echo "::warning::auto-merge 예약 실패 — PR을 수동으로 머지해주세요"
          fi

      # changelog가 실제로 바뀐 경우, 또는 수동 workflow_dispatch(강제 업로드 목적)일 때
      # 업로드한다 (secrets는 step if:에서 직접 참조할 수 없으므로, GITBOOK_* env 부재 시
      # self-gate는 스크립트가 스스로 판단해 exit 0 한다).
      #
      # sdk-runtime-generator~/reports/api-changelog.md를 명시적으로 넘긴다 —
      # Documentation~/changelog/api-changelog.md가 아니다. "Commit Report" 스텝의
      # gh pr merge --delete-branch가 머지 후 로컬 체크아웃을 base 브랜치로 되돌리므로,
      # 이 시점의 워킹트리는 이미 main 상태다. Documentation~/changelog/ 밑의 파일을
      # 읽으면 1회차엔 파일이 아예 없고(ENOENT) 2회차부터는 한 세대 낡은 내용을 올리게 된다.
      # reports/ 산출물은 .gitignore 대상(추적되지 않음)이라 git checkout의 영향을 받지
      # 않고 "Generate Report" 스텝이 방금 만든 최신 내용 그대로 남아있다.
      - name: Upload Changelog to GitBook
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITBOOK_SPACE_ID: ${{ secrets.GITBOOK_SPACE_ID }}
          GITBOOK_CHANGELOG_PAGE_ID: ${{ secrets.GITBOOK_CHANGELOG_PAGE_ID }}
        run: node "scripts~/upload-changelog-to-gitbook.js" "sdk-runtime-generator~/reports/api-changelog.md"
