name: SDK Update
run-name: "SDK Update${{ inputs.version && format(' - v{0}', inputs.version) || '' }}${{ inputs.force && ' (force)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.6.0) - 비워두면 누락된 버전 중 가장 높은 버전 하나를 감지'
        required: false
        type: string
      force:
        description: '이미 같은 버전이 있어도 강제 업데이트'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 1-5'  # 평일 오전 9시 KST (UTC 0시)

permissions:
  contents: write
  pull-requests: write
  actions: write
  # 필수 'scan' 체크를 bot PR에 직접 보고하기 위해 필요 (아래 'scan 체크 충족' step)
  statuses: write

# 정기 실행과 수동 실행이 겹쳐 같은 버전 PR이 두 번 만들어지는 것을 막는다.
concurrency:
  group: sdk-update
  cancel-in-progress: false

jobs:
  # =====================================================
  # 누락된 버전 감지
  # =====================================================
  detect-versions:
    name: 누락된 버전 감지
    runs-on: ubuntu-latest
    outputs:
      # 처리할 버전은 하나다: 누락 버전이 여러 개여도 가장 높은 버전만 PR로 만든다.
      version: ${{ steps.detect.outputs.version }}
      has_versions: ${{ steps.detect.outputs.has_versions }}
      # 처리할 버전의 열린 PR이 이미 있으면 그 번호 (낮은 버전 PR 정리 기준)
      open_pr: ${{ steps.detect.outputs.open_pr }}
      skipped_versions: ${{ steps.detect.outputs.skipped_versions }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: 누락된 버전 감지
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # 입력된 버전이 있으면 해당 버전만 사용
          if [ -n "${INPUT_VERSION}" ]; then
            if ! [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::올바른 버전 형식이 아닙니다: ${INPUT_VERSION}"
              exit 1
            fi
            echo "입력된 버전 사용: ${INPUT_VERSION}"
            {
              echo "version=${INPUT_VERSION}"
              echo "has_versions=true"
              echo "open_pr="
              echo "skipped_versions="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # npm에서 모든 버전 가져오기 (정식 릴리즈만, dev/alpha/beta 제외)
          echo "=== npm에서 버전 목록 가져오기 ==="
          ALL_NPM_VERSIONS=$(npm view @apps-in-toss/web-framework versions --json | jq -r '.[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          echo "npm 버전 목록:"
          echo "$ALL_NPM_VERSIONS"

          # 현재 SDK 버전 확인
          CURRENT_VERSION=$(jq -r '.version' package.json)
          CURRENT_MAJOR="${CURRENT_VERSION%%.*}"
          echo ""
          echo "현재 SDK 버전: ${CURRENT_VERSION} (메이저: ${CURRENT_MAJOR})"

          # 기존 릴리즈 태그 목록
          echo ""
          echo "=== 기존 릴리즈 태그 확인 ==="
          EXISTING_TAGS=$(git tag -l 'release/v*' | sed 's/release\/v//' | sort -V)
          echo "기존 태그:"
          echo "$EXISTING_TAGS"

          # 열린 PR 목록 (update/ 브랜치) — 버전별 PR 번호를 함께 읽는다
          echo ""
          echo "=== 열린 PR 확인 ==="
          OPEN_PRS=$(gh pr list --state open --limit 200 --json number,headRefName --jq '.[] | select(.headRefName | startswith("update/")) | "\(.number) \(.headRefName | sub("^update/"; "") | sub("-.*$"; ""))"' 2>/dev/null || echo "")
          echo "열린 update/ PR (번호 버전):"
          echo "$OPEN_PRS"

          # 배포 제외 버전(denylist)은 후보에서 뺀다. 가장 높은 후보가 제외 버전이면 매번 실패하고
          # 그 아래 버전으로 내려가지 못하기 때문이다.
          DENIED_VERSIONS=$(jq -r '(.deniedVersions // [])[]' sdk-policy.json)

          # 누락된 버전 찾기 (열린 PR 유무는 여기서 보지 않는다 — 최상위 후보를 고른 뒤 확인)
          echo ""
          echo "=== 누락된 버전 감지 ==="
          MISSING_VERSIONS=""

          for VERSION in $ALL_NPM_VERSIONS; do
            # 메이저 버전 ceiling 가드: 현재 메이저보다 높은 메이저는 자동 승격 차단
            # (예: 현재 3.x → 4.0.0 자동 PR 생성 금지). 메이저는 API 표면이 바뀌므로
            # 의도적 검증을 거쳐 workflow_dispatch의 version 입력으로만 승격한다.
            CANDIDATE_MAJOR="${VERSION%%.*}"
            if [ "$CANDIDATE_MAJOR" -gt "$CURRENT_MAJOR" ]; then
              echo "  ${VERSION}: 메이저 상향(${CURRENT_MAJOR} → ${CANDIDATE_MAJOR}) 자동 승격 차단 (스킵)"
              continue
            fi

            # 현재 버전 이하는 스킵
            if [ "$(printf '%s\n' "$CURRENT_VERSION" "$VERSION" | sort -V | head -n1)" = "$VERSION" ] && [ "$VERSION" != "$CURRENT_VERSION" ]; then
              continue
            fi

            # 이미 릴리즈 태그가 있으면 스킵
            if echo "$EXISTING_TAGS" | grep -qx "$VERSION"; then
              echo "  ${VERSION}: 이미 릴리즈됨 (스킵)"
              continue
            fi

            # 배포 제외 버전이면 스킵
            DENIED_HIT=""
            for DENIED in $DENIED_VERSIONS; do
              if [ "$VERSION" = "$DENIED" ] || [[ "$VERSION" == "$DENIED"-* ]]; then
                DENIED_HIT="$DENIED"
              fi
            done
            if [ -n "$DENIED_HIT" ]; then
              echo "  ${VERSION}: 배포 제외 버전 (스킵, 거부 목록: ${DENIED_HIT})"
              continue
            fi

            echo "  ${VERSION}: 누락됨 (후보)"
            MISSING_VERSIONS="${MISSING_VERSIONS} ${VERSION}"
          done

          MISSING_VERSIONS=$(echo "$MISSING_VERSIONS" | xargs)

          if [ -z "$MISSING_VERSIONS" ]; then
            echo ""
            echo "누락된 버전이 없습니다."
            {
              echo "version="
              echo "has_versions=false"
              echo "open_pr="
              echo "skipped_versions="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 후보 중 가장 높은 버전 하나만 처리한다. 중간 버전은 건너뛴다
          # (버전마다 PR을 만들면 PR끼리 충돌하고 리베이스가 반복된다).
          LATEST=$(echo "$MISSING_VERSIONS" | tr ' ' '\n' | sort -V | tail -n1)
          SKIPPED=$(echo "$MISSING_VERSIONS" | tr ' ' '\n' | grep -vx "$LATEST" | xargs || true)
          echo ""
          echo "누락된 버전 후보: ${MISSING_VERSIONS}"
          echo "처리 대상(최신): ${LATEST}"
          echo "건너뛴 중간 버전: ${SKIPPED:-없음}"

          # 최신 버전의 열린 PR이 이미 있으면 새로 만들 것이 없다 (낮은 버전 PR 정리는 별도 잡)
          OPEN_PR=$(echo "$OPEN_PRS" | awk -v v="$LATEST" '$2 == v { print $1; exit }')

          {
            echo "version=${LATEST}"
            echo "skipped_versions=${SKIPPED}"
            echo "open_pr=${OPEN_PR}"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$OPEN_PR" ]; then
            echo "v${LATEST}: 열린 PR #${OPEN_PR} 존재 (새 PR 생성 스킵)"
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 감지 결과 요약
        env:
          TARGET_VERSION: ${{ steps.detect.outputs.version }}
          HAS_VERSIONS: ${{ steps.detect.outputs.has_versions }}
          OPEN_PR: ${{ steps.detect.outputs.open_pr }}
          SKIPPED_VERSIONS: ${{ steps.detect.outputs.skipped_versions }}
        run: |
          {
            echo "## SDK Update - 버전 감지 결과"
            echo ""
            if [ "$HAS_VERSIONS" = "true" ]; then
              echo "### 처리 대상 버전"
              echo ""
              echo "- v${TARGET_VERSION}"
            elif [ -n "$OPEN_PR" ]; then
              echo "v${TARGET_VERSION} 업데이트 PR #${OPEN_PR} 이(가) 이미 열려 있습니다."
            else
              echo "✅ 누락된 버전이 없습니다."
            fi
            if [ -n "$SKIPPED_VERSIONS" ]; then
              echo ""
              echo "### 건너뛴 중간 버전"
              echo ""
              echo "가장 높은 버전만 처리합니다: ${SKIPPED_VERSIONS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =====================================================
  # 최신 버전 하나에 대한 PR 생성
  # =====================================================
  update:
    name: SDK 업데이트 v${{ needs.detect-versions.outputs.version }}
    runs-on: ubuntu-latest
    needs: detect-versions
    if: needs.detect-versions.outputs.has_versions == 'true'

    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 버전 설정
        id: version
        env:
          VERSION: ${{ needs.detect-versions.outputs.version }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # 타임스탬프 생성 (YYYYMMDD-HHmmss)
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

          BRANCH_NAME="update/${VERSION}-${TIMESTAMP}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: 배포 제외 버전(denylist) 확인
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 건너뛴 버전의 실수 재배포 방지. workflow_dispatch로 명시 버전을 입력하면
          # 위 감지 단계의 스킵 가드들이 우회되므로 여기서 반드시 걸러야 한다.
          DENIED_VERSIONS=$(jq -r '(.deniedVersions // [])[]' sdk-policy.json)
          for DENIED in $DENIED_VERSIONS; do
            if [ "$VERSION" = "$DENIED" ] || [[ "$VERSION" == "$DENIED"-* ]]; then
              echo "::error::배포가 제외된 버전입니다: ${VERSION} (거부 목록: ${DENIED})"
              exit 1
            fi
          done

      - name: 스킵 판단
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FORCE="${{ github.event.inputs.force }}"

          SKIP="false"

          # 이미 같은 버전의 열린 PR이 있는지 재확인
          EXISTING_PR=$(gh pr list --state open --search "head:update/${VERSION}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ] && [ "$FORCE" != "true" ]; then
            echo "::warning::이미 버전 ${VERSION}에 대한 열린 PR이 있습니다: #${EXISTING_PR}"
            SKIP="true"
          fi

          echo "skip=${SKIP}" >> $GITHUB_OUTPUT

      - name: Git 설정
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 동반 패키지(web-analytics/bridge-core/devtools) 버전을 npm에서 결정해 기준 파일
      # (.github/sdk-versions.json)에 기록한다. 규칙과 근거는 스크립트 머리말 참고.
      # 다음 단계(SDK 재생성)와 "버전 파일 동기화" 단계가 이 기준 파일을 읽는다.
      - name: 동반 패키지 버전 결정
        if: steps.check.outputs.skip != 'true'
        run: |
          node .github/scripts/sdk-update/sync-sdk-versions.cjs resolve \
            --version "${{ steps.version.outputs.version }}" \
            --registry https://registry.npmjs.org

      - name: web-framework 버전 업데이트 및 SDK 재생성
        if: steps.check.outputs.skip != 'true'
        id: generate
        working-directory: sdk-runtime-generator~
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ANALYTICS_VERSION=$(jq -r '.companions["@apps-in-toss/web-analytics"]' ../.github/sdk-versions.json)

          echo "=== web-framework v${VERSION}, web-analytics v${ANALYTICS_VERSION} 업데이트 ==="

          # 캐시 정리 후 강제 업데이트 (캐시로 인한 오래된 버전 문제 방지)
          pnpm store prune
          pnpm update "@apps-in-toss/web-framework@${VERSION}" "@apps-in-toss/web-analytics@${ANALYTICS_VERSION}" --force --registry https://registry.npmjs.org

          # 설치된 버전 검증
          INSTALLED_VERSION=$(pnpm list @apps-in-toss/web-framework --json | jq -r '.[0].dependencies["@apps-in-toss/web-framework"].version')
          echo "요청 버전: ${VERSION}"
          echo "설치된 버전: ${INSTALLED_VERSION}"
          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "::error::버전 불일치! 요청: ${VERSION}, 설치됨: ${INSTALLED_VERSION}"
            exit 1
          fi
          echo "✅ 버전 검증 완료: ${INSTALLED_VERSION}"

          echo "SDK 코드 생성 중..."
          # 타입 검사 실패해도 PR 생성을 위해 계속 진행
          if pnpm generate; then
            echo "generate_status=success" >> $GITHUB_OUTPUT
            echo "SDK 코드 생성 완료"
          else
            echo "generate_status=failed" >> $GITHUB_OUTPUT
            echo "::warning::SDK 코드 생성 실패 - PR 생성 후 수동 수정 필요"
          fi

      # 다중 버전 호환성 테스트용 pnpm alias 추가
      # 이 alias는 SDK 생성에는 사용되지 않으며, 이후 CI에서 multi-version 테스트 시 사용됨.
      # 건너뛴 중간 버전도 호환성 커버리지와 API changelog를 잃지 않도록 alias는 함께 추가한다.
      # 대상은 기존 alias 최고 버전 초과 ~ 처리 버전 이하의 npm 정식 버전 전부(배포 제외 버전 빼고)다.
      # detect-versions의 skipped_versions만 보면 version 입력으로 실행했을 때(skipped가 비어 있음)
      # 중간 버전 alias가 빠져 changelog에서 해당 버전 구간이 통째로 사라진다.
      - name: 다중 버전 테스트 alias 추가
        if: steps.check.outputs.skip != 'true'
        working-directory: sdk-runtime-generator~
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ADDED="false"

          HIGHEST_ALIAS=$(jq -r '.devDependencies | keys[] | select(test("^web-framework-[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^web-framework-"; "")' package.json | sort -V | tail -n1)
          DENIED_VERSIONS=$(jq -r '(.deniedVersions // [])[]' ../sdk-policy.json)
          ALIAS_VERSIONS=""
          for V in $(npm view @apps-in-toss/web-framework versions --json | jq -r '.[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V); do
            # HIGHEST_ALIAS < V <= VERSION
            if [ -n "$HIGHEST_ALIAS" ] && [ "$(printf '%s\n%s\n' "$V" "$HIGHEST_ALIAS" | sort -V | tail -n1)" = "$HIGHEST_ALIAS" ]; then
              continue
            fi
            if [ "$(printf '%s\n%s\n' "$V" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
              continue
            fi
            if echo "$DENIED_VERSIONS" | grep -qx "$V"; then
              echo "⏭️ 배포 제외 버전이라 alias 생략: ${V}"
              continue
            fi
            ALIAS_VERSIONS="${ALIAS_VERSIONS} ${V}"
          done
          echo "alias 대상: ${ALIAS_VERSIONS:-없음} (기존 최고: ${HIGHEST_ALIAS:-없음})"

          for ALIAS_VERSION in $ALIAS_VERSIONS $VERSION; do
            ALIAS_KEY="web-framework-${ALIAS_VERSION}"

            # package.json devDependencies에 alias가 없으면 추가
            if ! jq -e ".devDependencies[\"${ALIAS_KEY}\"]" package.json > /dev/null 2>&1; then
              jq --arg key "$ALIAS_KEY" \
                 --arg val "npm:@apps-in-toss/web-framework@${ALIAS_VERSION}" \
                 '.devDependencies[$key] = $val' package.json > tmp.json
              mv tmp.json package.json
              echo "✅ 테스트 alias 추가: ${ALIAS_KEY}"
              ADDED="true"
            else
              echo "⏭️ alias 이미 존재: ${ALIAS_KEY}"
            fi
          done

          if [ "$ADDED" = "true" ]; then
            pnpm install --no-frozen-lockfile
          fi

      # 기준 파일의 값을 루트 package.json, 생성기 package.json, BuildConfig package.json,
      # PNPM_VERSION 에 쓰고, 모두 일치하는지 다시 검사한다.
      - name: 버전 파일 동기화
        if: steps.check.outputs.skip != 'true'
        run: |
          node .github/scripts/sdk-update/sync-sdk-versions.cjs apply
          node .github/scripts/sdk-update/sync-sdk-versions.cjs check

      - name: BuildConfig pnpm-lock.yaml 업데이트
        if: steps.check.outputs.skip != 'true'
        run: |
          cd WebGLTemplates/AITTemplate/BuildConfig~
          pnpm install --no-frozen-lockfile
          echo "BuildConfig pnpm-lock.yaml 업데이트 완료"

      - name: 변경 스테이징
        if: steps.check.outputs.skip != 'true'
        id: commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 변경사항 확인
          if git diff --quiet && git diff --staged --quiet; then
            echo "변경사항이 없습니다."
            echo "no_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 모든 변경사항 스테이징 (signed-commit 액션이 스테이징된 index를 커밋한다)
          git add -A

          {
            echo "message<<COMMIT_MESSAGE_EOF"
            echo "기능: SDK v${VERSION} 업데이트"
            echo ""
            echo "- @apps-in-toss/web-framework v${VERSION} 기반 SDK 코드 재생성"
            echo "- .github/sdk-versions.json 갱신 (web-framework/web-analytics/bridge-core/devtools)"
            echo "- package.json·BuildConfig package.json 버전 동기화"
            echo "- unity-bridge.ts 자동 생성"
            echo ""
            echo "자동 생성: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "COMMIT_MESSAGE_EOF"
          } >> $GITHUB_OUTPUT
          echo "no_changes=false" >> $GITHUB_OUTPUT

      # git commit + git push 로 만든 bot 커밋은 서명이 없어 main Ruleset(required_signatures)에
      # 막혀 PR이 머지되지 않았다(#1246 v3.7.0, #1261 v3.8.0). REST git data API로 만든 커밋은
      # GitHub이 자동 서명(Verified)하므로 composite action으로 새 브랜치를 만든다.
      # force=false: 같은 이름 브랜치가 이미 있으면 non-FF로 거부된다(기존 git push와 동일).
      - name: 브랜치 생성 및 서명 커밋
        if: steps.check.outputs.skip != 'true' && steps.commit.outputs.no_changes != 'true'
        uses: ./.github/actions/signed-commit
        with:
          branch: ${{ steps.version.outputs.branch_name }}
          message: ${{ steps.commit.outputs.message }}

      - name: PR 생성
        if: steps.check.outputs.skip != 'true' && steps.commit.outputs.no_changes != 'true'
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH_NAME="${{ steps.version.outputs.branch_name }}"
          GENERATE_STATUS="${{ steps.generate.outputs.generate_status }}"
          FAMILY=$(jq -r '.companions | to_entries | map("\(.key | sub("@apps-in-toss/"; "")) v\(.value)") | join(", ")' .github/sdk-versions.json)
          SKIPPED="${{ needs.detect-versions.outputs.skipped_versions }}"
          if [ -n "$SKIPPED" ]; then
            SKIPPED_NOTE="
          건너뛴 중간 버전: ${SKIPPED// /, } (가장 높은 버전만 PR로 만듭니다)"
          else
            SKIPPED_NOTE=""
          fi

          # SDK 생성 실패 시 경고 메시지
          if [ "$GENERATE_STATUS" = "failed" ]; then
            GENERATE_WARNING="> ⚠️ **SDK 코드 생성 중 타입 검사 실패** - 수동 수정이 필요합니다.

          "
            TITLE_PREFIX="[타입 오류] "
          else
            GENERATE_WARNING=""
            TITLE_PREFIX=""
          fi

          # PR 생성
          PR_RESULT=$(gh pr create \
            --title "${TITLE_PREFIX}SDK 업데이트: v${VERSION}" \
            --body "## SDK 업데이트: v${VERSION}

          ${GENERATE_WARNING}\`@apps-in-toss/web-framework\` v${VERSION} 기반으로 SDK 코드를 재생성했습니다.

          동반 패키지: ${FAMILY}${SKIPPED_NOTE}

          ### 검토 사항
          - [ ] E2E 테스트 통과 확인 (이 워크플로우에서 자동 실행)
          - [ ] 생성된 SDK 코드 검토

          ### 머지 후 자동 처리
          이 PR이 머지되면 자동으로 릴리즈가 생성됩니다:
          - 릴리즈 태그: \`release/v${VERSION}\`
          - GitHub Release: https://github.com/${{ github.repository }}/releases/tag/release/v${VERSION}

          ### UPM 설치 (머지 후)
          \`\`\`
          https://github.com/${{ github.repository }}.git#release/v${VERSION}
          \`\`\`" \
            --base main \
            --head "${BRANCH_NAME}")

          # PR 번호 추출
          PR_NUMBER=$(echo "$PR_RESULT" | grep -oE '[0-9]+$')

          echo "pr_url=${PR_RESULT}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "pr_created=true" >> $GITHUB_OUTPUT
          echo "PR 생성 완료: ${PR_RESULT} (번호: ${PR_NUMBER})"

      # GITHUB_TOKEN으로 생성된 PR은 다른 워크플로우를 자동 트리거하지 않으므로
      # 이 잡에서 직접 E2E 테스트를 workflow_dispatch로 트리거
      - name: E2E 테스트 트리거
        if: steps.create-pr.outputs.pr_created == 'true' && steps.create-pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          echo "E2E 테스트 트리거: PR #${PR_NUMBER}"
          jq -n --arg pr "${PR_NUMBER}" '{"ref":"main","inputs":{"target_ref":$pr}}' | \
            gh api "repos/${{ github.repository }}/actions/workflows/216286654/dispatches" \
            -X POST --input -
          echo "✅ E2E 테스트 트리거 완료: PR #${PR_NUMBER}"

      # 필수 'scan' 체크 충족. GITHUB_TOKEN으로 만든 PR은 GitHub 정책상
      # string-check.yml(pull_request)을 트리거하지 못해 scan이 영구 pending →
      # 머지 불가가 된다(PR #771에서 확인). string-check.yml의 'bot PR → scan skip'
      # 정책과 동일하게 scan=success를 직접 보고한다(update-changelog.yml과 같은 패턴).
      - name: 필수 scan 체크 충족 (bot PR)
        if: steps.create-pr.outputs.pr_created == 'true' && steps.create-pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: |
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" -X POST \
            -f state=success \
            -f context=scan \
            -f description="bot SDK 업데이트 PR — scan skipped (github-actions[bot])"
          echo "✅ scan status 보고 완료: ${HEAD_SHA}"

      - name: 업데이트 요약
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SKIP="${{ steps.check.outputs.skip }}"
          NO_CHANGES="${{ steps.commit.outputs.no_changes }}"
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"

          echo "## SDK 업데이트 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SKIP" = "true" ]; then
            echo "⏭️ **업데이트 스킵됨**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "이미 최신 버전이거나 동일 버전의 열린 PR이 존재합니다." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> E2E 테스트가 스킵되었습니다 (변경사항 없음)" >> $GITHUB_STEP_SUMMARY
          elif [ "$NO_CHANGES" = "true" ]; then
            echo "⏭️ **변경사항 없음**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "SDK 재생성 결과 기존 코드와 동일합니다." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> E2E 테스트가 스킵되었습니다 (변경사항 없음)" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$PR_URL" ]; then
            echo "✅ **PR 생성 완료**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| 버전 | v${VERSION} |" >> $GITHUB_STEP_SUMMARY
            echo "| PR | ${PR_URL} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "E2E 테스트가 자동으로 실행됩니다." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **처리 실패**" >> $GITHUB_STEP_SUMMARY
          fi

  # =====================================================
  # 더 낮은 버전의 update/ PR 정리
  # 새 업데이트 PR을 만든 뒤(또는 최신 버전의 PR이 이미 열려 있을 때) 낮은 버전의 열린
  # bot update/ PR을 "대체됨" 코멘트와 함께 닫고 브랜치를 지운다. 사람이 만든 PR은 건드리지 않는다.
  # =====================================================
  supersede:
    name: 낮은 버전 PR 정리
    runs-on: ubuntu-latest
    needs: [detect-versions, update]
    # update 잡이 스킵·실패해도 최신 버전 PR이 이미 열려 있으면 정리한다.
    if: >-
      always() && needs.detect-versions.result == 'success' &&
      (needs.update.outputs.pr_number != '' || needs.detect-versions.outputs.open_pr != '')

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 낮은 버전 update/ PR 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.detect-versions.outputs.version }}
          NEW_PR_NUMBER: ${{ needs.update.outputs.pr_number || needs.detect-versions.outputs.open_pr }}
        run: bash .github/scripts/sdk-update/close-superseded-prs.sh
