<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 모바일 런타임 최적화 플래그(window.__AIT_PERF).
         빌드 시 해석된 실효값 JSON 이 작은따옴표 리터럴 안에 들어간다. 이 블록은 아래 모든 스크립트
         (페이지 캐시·조기 fetch·Runtime/ait-*.js)보다 먼저 실행돼야 하므로 head 맨 위에 둔다.
         JSON.parse 가 실패하면(플레이스홀더 미치환 포함) {} 로 fail-open — 각 스크립트가 자동 기본값으로 동작한다.
         키 계약은 Editor/Package/AITPerfFlags.cs 머리 주석 참조. -->
    <script>
        var __AIT_PERF = (function(){try{return JSON.parse('%AIT_PERF_FLAGS%')||{}}catch(e){return {}}})();
        window.__AIT_PERF = __AIT_PERF;
    </script>
    <title>Unity WebGL Player | %UNITY_WEB_NAME%</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!-- TemplateData/style.css 링크 없음: 모든 스타일은 아래 인라인 <style>에 있고(파일은 죽은 참조로 보존),
         스타일시트 <link>는 CSSOM 블로킹으로 뒤에 오는 조기 fetch 인라인 스크립트 실행을 지연시킴 -->
    <link rel="preload" as="script" href="%UNITY_WEBGL_FRAMEWORK_URL%" fetchpriority="high">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- AIT Page Cache (CacheStorage 인터셉터, SDK Auto-generated) -->
    %AIT_PAGE_CACHE_SCRIPT%

    <!-- Unity Resource Early Fetch (SDK Auto-generated) -->
    %AIT_EARLY_FETCH_SCRIPT%

    <!-- 메모리 텔레메트리(WebAssembly.Memory.grow 래퍼, crash-loop 감지).
         wasm 인스턴스화보다 먼저 설치돼야 하므로 head 에서 로드한다. 페이지 캐시·조기 fetch 인라인 스크립트
         '뒤'에 둬서 그 킥오프를 늦추지 않는다. -->
    <script src="Runtime/ait-mem.js"></script>

    <style>
        /* 모바일 터치 동작 정리: 당겨서 새로고침/바운스 스크롤 방지, 캔버스 위 제스처·텍스트 선택·롱프레스 메뉴·탭 하이라이트 제거 */
        html, body {
            overscroll-behavior: none;
        }

        #unity-canvas {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        
        #unity-container {
            position: fixed;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #231F20;
        }
        
        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        
        #unity-logo {
            width: 154px;
            height: 130px;
            background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        }
        
        #unity-progress-bar-empty {
            width: 141px;
            height: 18px;
            margin-top: 10px;
            margin-left: 6.5px;
            background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
        }
        
        #unity-progress-bar-full {
            width: 0%;
            height: 18px;
            margin-top: 10px;
            background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
        }
        
        #unity-footer {
            display: none;  /* 전체 화면 모드에서는 footer 숨김 */
        }
        
        #unity-webgl-logo {
            float: left;
            width: 38px;
            height: 38px;
            background: url('TemplateData/webgl-logo.png') no-repeat center;
        }
        
        #unity-build-title {
            float: right;
            margin-right: 10px;
            line-height: 38px;
            font-family: arial;
            font-size: 18px;
        }
        
        #unity-fullscreen-button {
            cursor: pointer;
            float: right;
            width: 38px;
            height: 38px;
            background: url('TemplateData/fullscreen-button.png') no-repeat center;
        }
        
        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%, 0);
            background: white;
            border: 2px solid red;
            padding: 5px;
            display: none;
        }
    </style>

    <!-- 소프트 키보드 뷰포트 고정.
         Unity WebGL의 소프트 키보드 입력창(MobileKeyboard.js)은 position:fixed; bottom:0 으로 붙는다.
         iOS WKWebView는 키보드가 뜨면 그 입력창을 키보드 위로 드러내려고 문서를 스크롤하는데,
         position:fixed 인 #unity-container 가 그 스크롤을 따라 위로 끌려가 상단 UI가 화면 밖으로 밀린다
         (iOS 26.5 WKWebView 실측: 컨테이너 top 0 → -403px).
         visualViewport 의 resize/scroll 마다 컨테이너를 "보이는 영역"에 다시 맞춘다. 컨테이너 높이가
         줄어들면 캔버스(height:100%)도 같이 줄어 Unity가 키보드 위 영역 기준으로 다시 레이아웃한다.
         키보드가 내려가면 인라인 스타일을 지워 CSS 기본값(top:0; height:100%)으로 되돌린다 —
         회전 등으로 px 값이 낡은 채 남지 않게. -->
    <script>
        (function () {
            var vv = window.visualViewport;
            if (!vv) return;
            var raf = 0;
            function apply() {
                raf = 0;
                var c = document.getElementById('unity-container');
                if (!c) return;
                var keyboardUp = vv.offsetTop > 1 || Math.abs(vv.height - window.innerHeight) > 1;
                if (keyboardUp) {
                    c.style.top = Math.round(vv.offsetTop) + 'px';
                    c.style.height = Math.round(vv.height) + 'px';
                } else {
                    c.style.top = '';
                    c.style.height = '';
                }
            }
            function schedule() { if (!raf) raf = requestAnimationFrame(apply); }
            vv.addEventListener('resize', schedule);
            vv.addEventListener('scroll', schedule);
        })();
    </script>

    <!-- USER_HEAD_START - 이 영역에 사용자 커스텀 스크립트/스타일을 추가하세요 -->
    <!-- 예: <script src="https://cdn.example.com/library.js"></script> -->
    <!-- 예: <link rel="stylesheet" href="custom.css"> -->
    <!-- USER_HEAD_END -->
</head>
<body>
    <!-- 로딩 화면 래퍼 (SDK가 이 래퍼를 통해 로딩 화면을 제어) -->
    <div id="ait-loading-wrapper">
        <!-- loading.html 내용이 여기에 삽입됨 -->
        %AIT_LOADING_SCREEN%
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width="%UNITY_WIDTH%" height="%UNITY_HEIGHT%" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <script>
            // ⚠️ 이 주석에 로딩 화면 플레이스홀더 토큰(퍼센트로 감싼 AIT_LOADING_SCREEN)을 그대로
            // 적지 말 것 — 치환이 단순 문자열 Replace 라 주석 안에도 loading.html 전문이 주입되고,
            // '//' 주석은 첫 줄만 막으므로 2번째 줄부터 살아있는 JS 로 파싱되어 이 <script> 블록
            // 전체가 SyntaxError 로 죽는다(= 아래 로딩 바 제거가 통째로 실행되지 않음).
            // AIT 로딩 오버레이가 실제로 삽입된 경우(위 플레이스홀더 치환 결과가 비어있지 않음)에만
            // Unity 기본 로딩 바를 동기적으로 제거한다. 브라우저의 레이아웃/페인트가 일어나기 전에
            // DOM에서 떼어내므로 #unity-logo / #unity-progress-bar-* 의 CSS 배경 PNG
            // (TemplateData/*.png) 네트워크 요청 자체가 발생하지 않는다 — AIT 오버레이(z-index 9998)가
            // 어차피 화면 전체를 덮으므로 Unity 로딩 바는 다운로드할 이유가 없다.
            // AIT 오버레이 미사용 시(로딩 화면 파일 없음 등 폴백 상황)에는 Unity 로딩 바가 유일한
            // 진행률 UI이므로 절대 건드리지 않는다 — 아래 메인 스크립트에서 정상 동작해야 한다.
            (function () {
                var wrapper = document.getElementById('ait-loading-wrapper');
                if (wrapper && wrapper.firstElementChild) {
                    var bar = document.getElementById('unity-loading-bar');
                    if (bar && bar.parentNode) {
                        bar.parentNode.removeChild(bar);
                    }
                }
            })();
        </script>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-build-title">%UNITY_WEB_NAME%</div>
            <div id="unity-fullscreen-button" onclick="unityInstance.SetFullscreen(1)"></div>
        </div>
    </div>

    <!-- PlayerPrefs 영속화(앱인토스 Storage 미러링) 설정.
         빌드 시 %AIT_PLAYERPREFS_PERSISTENCE% 플레이스홀더가 "true"/"false"로 치환됨.
         미치환 리터럴('%AIT_PLAYERPREFS_PERSISTENCE%')은 "false"와 다르므로 true로 평가 — fail-open.
         ⚠️ 반드시 ait-playerprefs.js 로드 직전에 선언한다 — 그 스크립트의 부트스트랩이
         로드 즉시(스크립트 실행 시점) 이 값을 읽어 스냅샷 fetch 착수 여부를 결정하므로,
         순서가 뒤바뀌면 opt-out(enabled:false) 설정이 무시되고 fetch가 착수된다. -->
    <script>
        window.__AIT_PLAYERPREFS = {
            enabled: '%AIT_PLAYERPREFS_PERSISTENCE%' !== 'false',
            bootTimeoutMs: 2500
        };
    </script>
    <!-- PlayerPrefs 영속화 레이어 — Unity 로더보다 먼저 로드해 스냅샷 fetch를 미리 착수 -->
    <script src="Runtime/ait-playerprefs.js"></script>
    <!-- 라이프사이클·프레임 페이싱(ait-pacing.js)과 data 응답 재포장(ait-databuf.js).
         둘 다 config 가 만들어진 뒤 아래 메인 스크립트에서 configure(config) 로 활성화된다.
         databuf 는 페이지 캐시·조기 fetch 가 설치한 fetch 래퍼 '위'에 가장 바깥 래퍼로 얹혀야 하므로
         그 인라인 스크립트(head)보다 뒤인 여기서 로드한다. -->
    <script src="Runtime/ait-pacing.js"></script>
    <script src="Runtime/ait-databuf.js"></script>
    <script src="Runtime/ait-datarelease.js"></script>
    <!-- Web Framework Bridge - @apps-in-toss/web-framework 함수를 window.AppsInToss에 노출 -->
    <script type="module" src="./unity-bridge.ts"></script>

    <!-- Debug Console (vConsole) — 빌드 프로필로 게이팅, dev 전용. Unity 로더보다 먼저 로드해 조기 로그 캡처 -->
    <script>
        (function () {
            if ('%AIT_ENABLE_DEBUG_CONSOLE%' !== 'true') return;   // prod: 조기 반환, 아무것도 로드 안 함
            var v = document.createElement('script');
            v.src = 'Runtime/devconsole/vconsole.min.js';
            v.onload = function () {
                var s = document.createElement('script');
                s.src = 'Runtime/devconsole/ait-dev-console.js';    // VConsole 생성 + Metrics 플러그인 + 키보드 가드 + early-log replay
                document.head.appendChild(s);
            };
            v.onerror = function () { /* dev 콘솔 미가용, 비치명적 */ };
            document.head.appendChild(v);
        })();
    </script>

    <!-- AITLoading: 커스텀 로딩 화면 API -->
    <script>
        window.AITLoading = {
            // 번들 마킹 — 이 SDK 변형(perf 채널 등)으로 생성된 번들을 클라이언트/RUM 에서 식별.
            // 빌드 시 %AIT_BUILD_VARIANT% 가 치환됨(미치환 시 빈 문자열 → main 산출 번들).
            buildVariant: '%AIT_BUILD_VARIANT%',

            // 앱 정보 (초기화 전 기본값)
            appInfo: {
                iconUrl: '',
                displayName: '',
                primaryColor: '#3182f6'
            },

            // 초기화 완료 여부 (내부용)
            _initialized: false,
            _readyCallbacks: [],
            _progressCallbacks: [],
            _completeCallbacks: [],
            _errorCallbacks: [],
            _isComplete: false,

            // 초기화 완료 콜백 등록 (appInfo 사용 가능 시점)
            // 콜백은 초기화 시 호출되고, 네이티브 앱 정보가 나중에 로드되면 다시 호출됨
            onReady: function(callback) {
                if (typeof callback === 'function') {
                    // 항상 콜백 저장 (네이티브 정보 업데이트 시 다시 호출하기 위해)
                    this._readyCallbacks.push(callback);
                    // 이미 초기화된 경우 바로 호출
                    if (this._initialized) {
                        callback(this.appInfo);
                    }
                }
            },

            // 진행률 콜백 등록
            onProgress: function(callback) {
                if (typeof callback === 'function') {
                    this._progressCallbacks.push(callback);
                }
            },

            // 완료 콜백 등록
            onComplete: function(callback) {
                if (typeof callback === 'function') {
                    if (this._isComplete) {
                        callback();
                    } else {
                        this._completeCallbacks.push(callback);
                    }
                }
            },

            // 에러 콜백 등록
            onError: function(callback) {
                if (typeof callback === 'function') {
                    this._errorCallbacks.push(callback);
                }
            },

            // 로딩 화면 숨기기
            hide: function() {
                var wrapper = document.getElementById('ait-loading-wrapper');
                if (wrapper) {
                    wrapper.style.display = 'none';
                }
            }
        };
    </script>

    <!-- 브랜드 정보 초기화 -->
    <script>
        // Unity 빌드 시 플레이스홀더가 치환됨 (기본값)
        window.AITLoading.appInfo = {
            iconUrl: '%AIT_ICON_URL%',
            displayName: '%AIT_DISPLAY_NAME%',
            primaryColor: '%AIT_PRIMARY_COLOR%'
        };
        console.log('[AIT Loading] 빌드 설정 appInfo:', JSON.stringify(window.AITLoading.appInfo));

        // 네이티브 앱 정보로 업데이트하는 함수
        function updateAppInfoFromNative() {
            try {
                console.log('[AIT Loading] AppsInToss 존재:', !!window.AppsInToss);
                if (window.AppsInToss) {
                    console.log('[AIT Loading] getAppsInTossGlobals 존재:', typeof window.AppsInToss.getAppsInTossGlobals);
                }
                if (window.AppsInToss && typeof window.AppsInToss.getAppsInTossGlobals === 'function') {
                    var globals = window.AppsInToss.getAppsInTossGlobals();
                    console.log('[AIT Loading] 네이티브 globals 원본:', JSON.stringify(globals));
                    if (globals) {
                        // brandIcon이 있으면 사용, 없으면 빌드 설정 유지
                        if (globals.brandIcon) {
                            window.AITLoading.appInfo.iconUrl = globals.brandIcon;
                            console.log('[AIT Loading] 아이콘 URL 업데이트:', globals.brandIcon);
                        } else {
                            console.log('[AIT Loading] brandIcon 없음, 빌드 설정 유지:', window.AITLoading.appInfo.iconUrl);
                        }
                        if (globals.brandDisplayName) {
                            window.AITLoading.appInfo.displayName = globals.brandDisplayName;
                        }
                        if (globals.brandPrimaryColor) {
                            window.AITLoading.appInfo.primaryColor = globals.brandPrimaryColor;
                        }
                        console.log('[AIT Loading] 최종 appInfo:', JSON.stringify(window.AITLoading.appInfo));
                        return true;
                    }
                }
            } catch (e) {
                console.warn('[AIT Loading] 네이티브 앱 정보 로드 실패:', e);
            }
            return false;
        }

        // 네이티브 브릿지 대기 및 초기화 완료 처리
        function initializeAppInfo() {
            // 먼저 동기적으로 시도
            var nativeLoaded = updateAppInfoFromNative();

            if (!nativeLoaded) {
                // 네이티브 브릿지가 아직 없으면 짧은 시간 대기 후 재시도
                // 토스 앱에서 브릿지 주입이 약간 지연될 수 있음
                var maxAttempts = 10;
                var attempt = 0;
                var checkInterval = setInterval(function() {
                    attempt++;
                    if (updateAppInfoFromNative()) {
                        clearInterval(checkInterval);
                        console.log('[AIT Loading] 네이티브 브릿지 감지됨 (시도 ' + attempt + ')');
                        // 이미 초기화된 경우 콜백 다시 호출하여 UI 업데이트
                        if (window.AITLoading._initialized) {
                            window.AITLoading._readyCallbacks.forEach(function(cb) {
                                try { cb(window.AITLoading.appInfo); } catch(e) {}
                            });
                        }
                    } else if (attempt >= maxAttempts) {
                        clearInterval(checkInterval);
                        console.log('[AIT Loading] 네이티브 브릿지 없음, 빌드 설정 사용');
                    }
                }, 50); // 50ms 간격으로 최대 500ms 대기
            }

            // 초기화 완료 표시 및 대기 중인 콜백 호출
            window.AITLoading._initialized = true;
            window.AITLoading._readyCallbacks.forEach(function(cb) {
                try { cb(window.AITLoading.appInfo); } catch(e) { console.error('[AIT Loading] onReady callback error:', e); }
            });
            // 주의: _readyCallbacks를 비우지 않음 - 네이티브 정보가 나중에 로드될 때 다시 호출하기 위해
        }

        initializeAppInfo();
    </script>

    <!-- 에러 표시 함수 (Unity Loader보다 먼저 정의) -->
    <script>
        // 에러 표시 함수
        function showLoadError(title, message, hints, debugInfo) {
            console.error('[AIT] ' + title);
            console.error('[AIT] ' + message);
            if (hints) {
                hints.forEach(function(hint) {
                    console.error('[AIT]   - ' + hint);
                });
            }
            if (debugInfo) {
                console.error('[AIT] Debug info:', JSON.stringify(debugInfo, null, 2));
            }

            // 로딩 화면을 에러 화면으로 변경
            var wrapper = document.getElementById('ait-loading-wrapper');
            if (wrapper) {
                wrapper.innerHTML =
                    '<div style="padding: 20px; text-align: center; max-width: 400px;">' +
                        '<div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>' +
                        '<div style="font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #ff6b6b;">' + title + '</div>' +
                        '<div style="font-size: 14px; margin-bottom: 20px; color: #ccc;">' + message + '</div>' +

                        }
                    }

                    // ASM_CONSTS 초기화 타이밍 오류 감지 시 자동 재시도
                    // Unity WASM 런타임의 레이스 컨디션으로 ASM_CONSTS 배열이 아직 초기화되지 않은 상태에서
                    // emscripten_asm_const_int_sync_on_main_thread가 호출될 수 있음
                    var isAsmConstsError = /ASM_CONSTS/.test(errorStr);
                    var retryKey = '__ait_reload_count__';
                    var maxRetries = 2;
                    var currentRetries = parseInt(sessionStorage.getItem(retryKey) || '0', 10);

                    if (isAsmConstsError && currentRetries < maxRetries) {
                        sessionStorage.setItem(retryKey, String(currentRetries + 1));
                        console.warn('[AIT] ASM_CONSTS 초기화 오류 감지, 자동 재시도 (' + (currentRetries + 1) + '/' + maxRetries + ')');
                        location.reload();
                        return;
                    }

                    // 재시도 횟수 초기화 (다른 에러이거나 재시도 소진)
                    sessionStorage.removeItem(retryKey);

                    showLoadError(
                        '게임 로드 실패',
                        errorStr,
                        [
                            '네트워크 연결 상태를 확인해 주세요.',
                            '잠시 후 다시 시도해 주세요.',
                            '문제가 계속되면 앱을 재시작해 주세요.'
                        ],
                        {
                            error: errorStr,
                            retryCount: currentRetries,
                            config: { dataUrl: config.dataUrl, frameworkUrl: config.frameworkUrl, codeUrl: config.codeUrl }
                        }
                    );
                });
            } // end of else block for createUnityInstance check
        }, 10000); // waitForLoader 타임아웃: 10초
    </script>
